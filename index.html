<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>ベイブレード</title>
<style>
  :root{
    --bg:#eef4ff; --panel:#ffffff; --ink:#16213c; --sub:#5a6a8c;
    --arena:#22355e; --arena2:#16233f; --ring:#3f5c96;
    --accent:#ffcf3f; --go:#ff4d4d; --boost:#22c55e;
    --card-border:#d7e0f2;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1526; --panel:#182540; --ink:#f2f6ff; --sub:#a9b8d8;
      --arena:#1b2c50; --arena2:#101c36; --ring:#46639f;
      --card-border:#2c3f68;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overscroll-behavior:none;}
  body{
    position:fixed; inset:0; width:100%;
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  #app{
    height:100dvh; max-width:1080px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); gap:10px;
  }

  /* ---------- えらぶ画面 ---------- */
  #pick{width:100%; text-align:center;}
  #pick .lead{font-size:clamp(22px,5vw,32px); font-weight:900; margin:6px 0 2px;}
  #pick .lead small{display:block; font-size:clamp(14px,3.4vw,18px); color:var(--sub); font-weight:700; margin-top:4px;}
  #beyChoices{display:flex; gap:10px; justify-content:center; margin-top:12px; flex-wrap:nowrap; width:100%;}
  .choice{
    border:4px solid var(--card-border); background:var(--panel); border-radius:24px;
    flex:1 1 0; min-width:0; max-width:170px; min-height:148px; padding:10px 4px 8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    font-family:inherit; color:var(--ink);
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .choice:active{transform:scale(.95);}
  .choice.sel{border-color:var(--accent); box-shadow:0 0 0 4px rgba(255,207,63,.35), 0 10px 24px rgba(0,0,0,.18); transform:scale(1.04);}
  /* カード幅に必ず収まる文字サイズにする（名前が枠にはみ出して重なるのを防ぐ） */
  .choice .cname{font-size:clamp(11px,3.1vw,20px); font-weight:900; white-space:nowrap; max-width:100%;}
  .choice .ctype{font-size:clamp(10px,2.6vw,14px); font-weight:800; color:var(--sub); white-space:nowrap; max-width:100%;}
  .choice .ctip{display:flex; align-items:center; gap:5px; font-size:clamp(9px,2.4vw,12px); font-weight:800; color:var(--sub); white-space:nowrap; max-width:100%;}
  .choice .ctip svg{width:26px; height:20px; flex:none;}
  .choice svg{width:min(17vw,96px); height:min(17vw,96px);}

  /* ---------- スタジアム ---------- */
  #stageWrap{flex:1; width:100%; display:flex; align-items:center; justify-content:center; min-height:0;}
  #stadium{
    position:relative; border-radius:50%; flex:none;
    width:280px; height:280px;
    background:radial-gradient(circle at 50% 42%, var(--arena) 0 55%, var(--arena2) 78%, #0a1226 100%);
    box-shadow:0 18px 40px rgba(10,20,50,.35), inset 0 0 0 10px var(--ring), inset 0 0 60px rgba(0,0,0,.45);
    overflow:hidden; touch-action:none;
  }
  #stadium::before{
    content:""; position:absolute; inset:16%; border-radius:50%;
    border:3px dashed rgba(255,255,255,.14);
  }
  #stadium::after{
    content:""; position:absolute; inset:38%; border-radius:50%;
    border:3px solid rgba(255,255,255,.10);
  }
  .bey{
    position:absolute; width:16.2%; aspect-ratio:1/1; left:0; top:0;
    will-change:transform; pointer-events:none; z-index:3;
  }
  .bey svg{width:100%; height:100%; display:block; filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));}
  .bey.strong svg{filter:drop-shadow(0 0 16px rgba(255,190,0,.95)) drop-shadow(0 8px 10px rgba(0,0,0,.45));}
  .bey.wobble svg{animation:wob .28s ease-in-out infinite alternate;}
  @keyframes wob{from{margin-left:-4px;}to{margin-left:4px;}}
  .bey .piece{position:absolute; inset:0; transition:transform .7s cubic-bezier(.2,.8,.3,1), opacity .7s;}
  .spark{
    position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
    background:radial-gradient(circle,#fff8d6 0 25%, #ffd23f 45%, rgba(255,140,0,0) 72%);
    pointer-events:none; z-index:5;
  }
  .ringFx{
    position:absolute; border:4px solid rgba(255,220,90,.85); border-radius:50%;
    pointer-events:none; z-index:4; transform:translate(-50%,-50%);
    animation:ringOut .45s ease-out forwards;
  }
  @keyframes ringOut{from{width:20px;height:20px;opacity:1;}to{width:150px;height:150px;opacity:0;}}
  #count{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    font-size:clamp(80px,22vw,170px); font-weight:900; color:#fff; z-index:8;
    text-shadow:0 6px 0 rgba(0,0,0,.25), 0 0 44px rgba(255,207,63,.8); pointer-events:none;
    text-align:center; line-height:1.05;
  }
  #count.pop{animation:cpop .5s ease;}
  @keyframes cpop{0%{transform:scale(1.7);}100%{transform:scale(1);}}

  /* ---------- たいりょくゲージ ---------- */
  #gauges{width:min(92vw,720px); display:none; gap:10px;}
  .gauge{flex:1;}
  .gauge .bar{height:22px; border-radius:999px; background:rgba(120,135,170,.3); overflow:hidden; border:3px solid var(--panel); box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .gauge .fill{height:100%; width:100%; border-radius:999px; transition:width .18s linear;}
  #gYou .fill{background:linear-gradient(90deg,#38bdf8,#2563eb);}
  #gCpu .fill{background:linear-gradient(90deg,#fda4af,#e11d48);}
  .gauge .who{font-size:15px; font-weight:900; text-align:center; margin-top:3px;}

  /* ---------- ボタン ---------- */
  #controls{width:min(92vw,720px); display:flex; flex-direction:column; gap:10px; align-items:stretch;}
  .bigbtn{
    border:none; cursor:pointer; font-family:inherit; font-weight:900; color:#fff;
    border-radius:999px; min-height:76px; font-size:clamp(26px,6.5vw,36px);
    letter-spacing:.04em; padding:10px 18px;
    box-shadow:0 8px 0 rgba(0,0,0,.22), 0 14px 28px rgba(0,0,0,.2);
    transition:transform .08s ease, box-shadow .08s ease, filter .15s;
  }
  .bigbtn:active{transform:translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.22);}
  #shootBtn{background:linear-gradient(180deg,#ff7a59,#f43f3f);}
  #shootBtn:disabled{filter:grayscale(.6) brightness(.8);}
  #tapBtn{background:linear-gradient(180deg,#4ade80,#16a34a); display:none;}
  #againBtn2{background:linear-gradient(180deg,#fbbf24,#f97316);}
  #tapBtn.cool{filter:grayscale(.55) brightness(.75);}
  .hintline{text-align:center; font-size:clamp(14px,3.6vw,18px); font-weight:800; color:var(--sub); min-height:1.4em;}

  /* ---------- けっか ---------- */
  #result{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(8,14,30,.45); z-index:20; padding:20px;
  }
  #result .card{
    background:var(--panel); border-radius:28px; padding:26px 22px; text-align:center;
    max-width:420px; width:100%; box-shadow:0 24px 60px rgba(0,0,0,.4);
    animation:rin .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes rin{from{transform:scale(.7); opacity:0;}to{transform:scale(1); opacity:1;}}
  #result .big{font-size:clamp(38px,10vw,56px); font-weight:900; line-height:1.15;}
  #result .sub{font-size:clamp(16px,4.4vw,20px); font-weight:800; color:var(--sub); margin:8px 0 18px;}
  #result .bigbtn{width:100%;}
  .confetti{position:fixed; top:-4vh; z-index:21; pointer-events:none; border-radius:3px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg);}}
  @media (prefers-reduced-motion: reduce){
    .confetti{display:none;}
  }
  /* 狭い画面ではカードの余白と枠を詰めて、文字がはみ出さないようにする */
  @media (max-width:480px){
    .choice{border-width:3px; padding:8px 2px 6px; border-radius:20px;}
    .choice .ctip{gap:4px;}
    .choice .ctip svg{width:20px; height:16px;}
  }
  /* 背の低い画面でもスクロールせず収まるように詰める */
  @media (max-height:620px){
    #app{gap:6px; padding-top:6px;}
    #pick .lead{font-size:20px; margin:2px 0 0;}
    #pick .lead small{font-size:13px;}
    #beyChoices{margin-top:8px;}
    .choice{min-height:104px; padding:6px 4px;}
    .choice svg{width:min(13vw,64px); height:min(13vw,64px);}
    .bigbtn{min-height:60px;}
  }
</style>
</head>
<body>
<div id="app">

  <div id="pick">
    <p class="lead">ベイを えらんでね！<small>すきな いろを タップ 👆</small></p>
    <div id="beyChoices"></div>
  </div>

  <div id="stageWrap">
    <div id="stadium">
      <div id="count"></div>
    </div>
  </div>

  <div id="gauges">
    <div class="gauge" id="gYou"><div class="bar"><div class="fill"></div></div><div class="who">⭐ きみ</div></div>
    <div class="gauge" id="gCpu"><div class="bar"><div class="fill"></div></div><div class="who">あいて 🤖</div></div>
  </div>

  <div id="controls">
    <div class="hintline" id="hint">ベイを えらぶと シュートできるよ</div>
    <button class="bigbtn" id="shootBtn" disabled>🚀 シュート！</button>
    <button class="bigbtn" id="tapBtn">👆 タップで パワーアップ！</button>
  </div>
</div>

<div id="result">
  <div class="card">
    <div class="big" id="resBig">🏆 かった！</div>
    <div class="sub" id="resSub">バーストフィニッシュ！</div>
    <button class="bigbtn" id="againBtn2">🔁 もういちど たたかう</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ===== ベイのデータ（オリジナル） ===== */
  /* そこ（底）の形で動きと持久が変わる：
     アタック＝平ら → 地面をよく掴んで激しく動き回るが、摩擦で持久が低い
     ディフェンス＝尖っている → 接点が小さく中心で大人しく安定して回る
     スタミナ＝丸い → バランス型で一番長く回る */
  var BEYS = [
    { id:"red",   name:"ほのおドラゴン", type:"🔥 アタック", tip:"flat",  tipLabel:"そこ：たいら", main:"#ef4444", dark:"#991b1b", light:"#fca5a5", blades:3, power:1.3,  stamina:0.68, move:1.75, roam:1.0 },
    { id:"blue",  name:"うみウェーブ",   type:"💧 スタミナ", tip:"round", tipLabel:"そこ：まるい", main:"#3b82f6", dark:"#1e3a8a", light:"#93c5fd", blades:4, power:0.95, stamina:1.3,  move:0.9,  roam:0.85 },
    { id:"green", name:"もりタートル",   type:"🌿 ディフェンス", tip:"sharp", tipLabel:"そこ：とがった", main:"#22c55e", dark:"#14532d", light:"#86efac", blades:6, power:0.8, stamina:1.08, move:0.42, roam:0.30 }
  ];

  /* 底の形の横から見た図（選択カード用） */
  function tipSVG(b){
    var tip = "";
    if (b.tip === "flat"){
      tip = '<rect x="6" y="13" width="28" height="5" rx="1.5" fill="'+b.main+'" stroke="'+b.dark+'" stroke-width="2"/>';
    } else if (b.tip === "sharp"){
      tip = '<path d="M8 13 L32 13 L20 19 Z" fill="'+b.main+'" stroke="'+b.dark+'" stroke-width="2" stroke-linejoin="round"/>';
    } else {
      tip = '<path d="M8 13 L32 13 A12 6 0 0 1 8 13 Z" fill="'+b.main+'" stroke="'+b.dark+'" stroke-width="2" stroke-linejoin="round"/>';
    }
    return '<svg viewBox="0 0 40 20" aria-hidden="true">' +
      '<rect x="15" y="1" width="10" height="8" rx="2" fill="'+b.light+'" stroke="'+b.dark+'" stroke-width="2"/>' +
      '<rect x="9" y="8" width="22" height="5" rx="2" fill="'+b.dark+'"/>' + tip + '</svg>';
  }

  function beySVG(b, uid){
    /* まんまるではなく、本物のベイみたいに角のある刃が突き出した形にする。
       中心(100,100)から半径r・角度degの点を返す */
    function P(r, deg){
      var rad = (deg-90)*Math.PI/180;
      return (100 + r*Math.cos(rad)).toFixed(1) + "," + (100 + r*Math.sin(rad)).toFixed(1);
    }
    var blades = "";
    var step = 360 / b.blades;
    for (var i=0;i<b.blades;i++){
      var a = step*i;
      /* ねじれた四角い刃：根元→鋭い先端→角→根元 */
      var pts = [P(56, a-step*0.40), P(98, a-step*0.02), P(88, a+step*0.22), P(60, a+step*0.38)].join(" ");
      blades += '<polygon points="'+pts+'" fill="'+b.main+'" stroke="'+b.dark+'" stroke-width="5" stroke-linejoin="round"/>';
      /* 刃と刃のあいだの小さな角（トゲ） */
      var sa = a + step*0.49;
      var spts = [P(52, sa-step*0.08), P(74, sa), P(52, sa+step*0.08)].join(" ");
      blades += '<polygon points="'+spts+'" fill="'+b.dark+'"/>';
    }
    return '' +
    '<svg viewBox="0 0 200 200" aria-hidden="true">' +
      blades +
      '<circle cx="100" cy="100" r="56" fill="'+b.main+'" stroke="'+b.dark+'" stroke-width="5"/>' +
      '<circle cx="100" cy="100" r="38" fill="'+b.light+'"/>' +
      '<circle cx="100" cy="100" r="20" fill="#ffffff" stroke="'+b.dark+'" stroke-width="4"/>' +
      '<circle cx="100" cy="100" r="8" fill="'+b.dark+'"/>' +
      '<circle cx="76" cy="72" r="9" fill="rgba(255,255,255,.55)"/>' +
    '</svg>';
  }
  /* バースト用：3つのパーツ */
  function beyPiecesHTML(b){
    var full = beySVG(b);
    return '' +
      '<div class="piece" data-p="0" style="clip-path:polygon(0 0,100% 0,50% 55%);">' + full + '</div>' +
      '<div class="piece" data-p="1" style="clip-path:polygon(0 0,50% 55%,0 100%);">' + full + '</div>' +
      '<div class="piece" data-p="2" style="clip-path:polygon(100% 0,100% 100%,0 100%,50% 55%);">' + full + '</div>';
  }

  /* ===== 音（Web Audio 合成） ===== */
  var AC = null;
  function audio(){
    if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if (AC && AC.state === "suspended") AC.resume();
    return AC;
  }
  function tone(freq, dur, type, vol, slideTo, delay){
    var ac = audio(); if(!ac) return;
    var t = ac.currentTime + (delay||0);
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type||"sine"; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.2, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t+dur+0.05);
  }
  function noise(dur, vol, freq, delay){
    var ac = audio(); if(!ac) return;
    var t = ac.currentTime + (delay||0);
    var len = Math.max(1, Math.floor(ac.sampleRate*dur));
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    var src = ac.createBufferSource(); src.buffer = buf;
    var f = ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value = freq||2000; f.Q.value = 0.8;
    var g = ac.createGain(); g.gain.value = vol||0.3;
    src.connect(f); f.connect(g); g.connect(ac.destination);
    src.start(t);
  }
  var SFX = {
    pick:   function(){ tone(660,.12,"triangle",.22); tone(990,.16,"triangle",.22,null,.08); },
    count:  function(){ tone(440,.14,"square",.16); },
    go:     function(){ tone(880,.4,"square",.2,1320); noise(.25,.12,3000); },
    shoot:  function(){ noise(.5,.28,900); tone(180,.5,"sawtooth",.1,720); },
    clash:  function(hard){ noise(.12,.4, hard?3400:2400); tone(hard?1560:1180,.1,"square",.14,300); },
    boost:  function(){ tone(520,.18,"sawtooth",.14,1180); },
    burst:  function(){ noise(.55,.5,700); tone(220,.5,"sawtooth",.22,40); tone(1200,.2,"square",.15,200,.03); },
    spinout:function(){ tone(700,.7,"sine",.18,90); },
    win:    function(){ [523,659,784,1046].forEach(function(f,i){ tone(f,.28,"triangle",.24,null,i*.13); }); noise(.4,.08,4000,.5); },
    lose:   function(){ [392,330,262].forEach(function(f,i){ tone(f,.3,"triangle",.2,null,i*.16); }); }
  };

  /* ===== 状態 ===== */
  var stadium = document.getElementById("stadium");
  var countEl = document.getElementById("count");
  var hintEl  = document.getElementById("hint");
  var shootBtn= document.getElementById("shootBtn");
  var tapBtn  = document.getElementById("tapBtn");
  var gauges  = document.getElementById("gauges");
  var resultEl= document.getElementById("result");
  var myBey = null, cpuBey = null;
  var battleCount = 0, cpuStrong = false; // 3回に1回、相手がボスとしてさらに強くなる
  var state = "pick"; // pick | count | battle | end
  var P = []; // 物理オブジェクト
  var raf = null, lastT = 0, boostReady = true;
  var slowmoT = 0; // 強い衝突直後のスロー（緩急用）
  var battleT = 0; // バトル経過時間（お椀地形の効きと渦の縮小に使う）
  var cpuBoostT = 1.0; // 相手も自分でパワーアップするタイマー

  /* スタジアムを空きスペースにぴったり合わせる */
  var stageWrap = document.getElementById("stageWrap");
  function fitStadium(){
    var w = stageWrap.clientWidth, h = stageWrap.clientHeight;
    if (!w || !h) return;
    var d = Math.max(180, Math.min(w, h, 780));
    stadium.style.width = d + "px";
    stadium.style.height = d + "px";
  }

  /* ===== ベイ選択 ===== */
  var choicesEl = document.getElementById("beyChoices");
  BEYS.forEach(function(b){
    var btn = document.createElement("button");
    btn.className = "choice"; btn.type = "button";
    btn.setAttribute("aria-label", b.name);
    btn.innerHTML = beySVG(b) + '<span class="cname">'+b.name+'</span><span class="ctype">'+b.type+'</span><span class="ctip">'+tipSVG(b)+b.tipLabel+'</span>';
    btn.addEventListener("click", function(){
      audio(); SFX.pick();
      myBey = b;
      var all = choicesEl.querySelectorAll(".choice");
      for (var i=0;i<all.length;i++) all[i].classList.remove("sel");
      btn.classList.add("sel");
      shootBtn.disabled = false;
      hintEl.textContent = "したの あかいボタンを おしてね！";
      preview();
    });
    choicesEl.appendChild(btn);
  });

  function makeBeyEl(b){
    var el = document.createElement("div");
    el.className = "bey";
    el.innerHTML = beySVG(b);
    stadium.appendChild(el);
    return el;
  }
  var previewEl = null;
  function preview(){
    fitStadium();
    clearStage();
    previewEl = makeBeyEl(myBey);
    var r = stadium.clientWidth;
    previewEl.style.transform = "translate("+(r*0.419)+"px,"+(r*0.419)+"px) rotate(20deg)";
  }
  function clearStage(){
    var els = stadium.querySelectorAll(".bey,.spark,.ringFx");
    for (var i=0;i<els.length;i++) els[i].remove();
    P = []; previewEl = null;
  }

  /* ===== バトル開始 ===== */
  shootBtn.addEventListener("click", function(){
    if (!myBey || state==="count" || state==="battle") return;
    audio();
    battleCount++;
    cpuStrong = (battleCount % 3 === 0);
    var pool = BEYS.filter(function(b){ return b.id !== myBey.id; });
    var base = pool[Math.floor(Math.random()*pool.length)];
    /* 通常戦の相手は基礎ステータスだけ 1.15倍。それ以外の仕組み
       （ダメージ・弾かれ方・バースト条件・減衰など）は両者完全に対称 */
    cpuBey = Object.assign({}, base, {
      power: base.power * 1.15,
      stamina: base.stamina * 1.15,
      move: base.move,
      roam: base.roam
    });
    if (cpuStrong){
      /* 3回に1回は格上のボス戦：基礎倍率と合わせて約1.35倍 */
      cpuBey = Object.assign({}, cpuBey, {
        power: cpuBey.power * 1.18,
        stamina: cpuBey.stamina * 1.18,
        move: Math.min(2.2, cpuBey.move * 1.05)
      });
    }
    startCountdown();
  });

  function startCountdown(){
    state = "count";
    slowmoT = 0;
    battleT = 0;
    cpuBoostT = 3.0 + Math.random()*1.0;
    shootBtn.style.display = "none";
    tapBtn.style.display = "none";
    resultEl.style.display = "none";
    document.getElementById("pick").style.display = "none";
    hintEl.textContent = "";
    clearStage();
    gauges.style.display = "flex";
    fitStadium();

    var r = stadium.clientWidth, size = r*0.162;
    P = [
      { b:myBey,  el:makeBeyEl(myBey),  x:r*0.30, y:r*0.62, vx:0, vy:0, ang:0, spin:0, max:100*myBey.stamina,  me:true,  mode:"orbit", modeT:0.8, pace:1, paceT:1, clashCd:0, kickT:0, jitterT:0, loopR:null, loopDir:-1, crossT:2, crossX:null, crossY:null },
      { b:cpuBey, el:makeBeyEl(cpuBey), x:r*0.70, y:r*0.38, vx:0, vy:0, ang:0, spin:0, max:100*cpuBey.stamina, me:false, mode:"orbit", modeT:1.3, pace:1, paceT:1, clashCd:0, kickT:0, jitterT:0, loopR:null, loopDir:-1, crossT:2, crossX:null, crossY:null }
    ];
    P.forEach(function(p){
      p.el.style.transform = "translate("+(p.x-size/2)+"px,"+(p.y-size/2)+"px)";
    });
    /* 金色の光と王冠はボス戦だけ。通常戦の相手は通常表示 */
    if (cpuStrong) P[1].el.classList.add("strong");
    document.querySelector("#gCpu .who").textContent = cpuStrong ? "👑 ボス あいて" : "あいて 🤖";
    updateGauges();

    countEl.style.display = "flex";
    var steps = ["3","2","1","ゴー！<br>シュート！"];
    var i = 0;
    (function next(){
      if (i < steps.length){
        countEl.innerHTML = steps[i];
        countEl.classList.remove("pop"); void countEl.offsetWidth; countEl.classList.add("pop");
        if (i === steps.length-1){ SFX.go(); SFX.shoot(); } else { SFX.count(); }
        i++; setTimeout(next, i===steps.length ? 620 : 780);
      } else {
        countEl.style.display = "none";
        launch();
      }
    })();
  }

  function launch(){
    state = "battle";
    var r = stadium.clientWidth;
    P.forEach(function(p, idx){
      p.spin = p.max;
      var a = Math.random()*Math.PI*2;
      var sp = r*0.55;
      p.vx = Math.cos(a)*sp; p.vy = Math.sin(a)*sp;
      if (idx===1){ p.vx = -p.vx*0.9; p.vy = -p.vy*0.9; }
    });
    tapBtn.style.display = "block";
    hintEl.textContent = cpuStrong ? "👑 ボスだ！ きあいで たたかおう！" : "タップで パワーアップ！ うまく あてよう！";
    boostReady = true; tapBtn.classList.remove("cool");
    lastT = performance.now();
    raf = requestAnimationFrame(tick);
  }

  /* ===== 物理ループ ===== */
  function pickMode(p){
    /* 追いかけ方は両方とも同じルール。CPUだけ常時突っ込んだりはしない */
    var roll = Math.random();
    var mv = p.b.move;
    var base = p.b.power >= 1.1 ? 0.48 : (p.b.power >= 0.9 ? 0.36 : 0.24);
    var chaseW = Math.min(0.66, Math.max(0.05, base * mv));
    var dur = (1.25 - 0.32 * mv);
    if (roll < chaseW){ p.mode = "chase"; p.paceT = 0.9 + 0.5*mv;  p.modeT = (0.7 + Math.random()*0.7) * dur; }
    else if (roll < chaseW + 0.38){ p.mode = "orbit"; p.paceT = 0.55 + 0.45*mv; p.modeT = (0.9 + Math.random()*1.1) * dur; }
    else { p.mode = "drift"; p.paceT = 0.25 + 0.25*mv; p.modeT = (0.8 + Math.random()*0.9) * dur; }
    /* 防御（底が尖っている）は実物どおり中心からほぼ動かない：
       突っ込みはたいてい中心まわりの小さな周回に置き換える */
    if (p.b.tip === "sharp" && p.mode === "chase" && Math.random() < 0.75){
      p.mode = "orbit"; p.paceT = 0.35 + 0.3*mv; p.modeT = 1.0 + Math.random()*0.8;
    }
  }

  function tick(now){
    if (state !== "battle") return;
    var rawDt = Math.min(0.033, (now-lastT)/1000); lastT = now;
    /* 強い衝突の直後だけ一瞬スローにして、弾かれた勢いとの緩急をつける */
    var dt = rawDt;
    if (slowmoT > 0){ slowmoT -= rawDt; dt = rawDt * 0.32; }
    battleT += rawDt;
    var r = stadium.clientWidth, size = r*0.162, rad = size/2;
    var cx = r/2, cy = r/2, maxD = r/2 - rad - r*0.035;

    /* 相手の自己ブースト：回復+6、間隔3.0〜4.0秒、ダッシュは控えめ。
       きみのタップブースト（回復+10）の方が強い */
    if (P.length===2){
      cpuBoostT -= dt;
      if (cpuBoostT <= 0){
        var cpu = P[1], you = P[0];
        cpu.spin = Math.min(cpu.max, cpu.spin + 6);
        var cdx = you.x-cpu.x, cdy = you.y-cpu.y, cd = Math.hypot(cdx,cdy)||1;
        cpu.vx += cdx/cd * r * 0.22; cpu.vy += cdy/cd * r * 0.22;
        cpu.kickT = 0.4; cpu.mode = "chase"; cpu.paceT = 1.3; cpu.modeT = 0.7;
        sparks(cpu.x, cpu.y, 6);
        cpuBoostT = 3.0 + Math.random()*1.0;
      }
    }

    P.forEach(function(p, idx){
      /* 疲れ方は両者まったく同じ計算。
         自然減衰は全体に約1.5倍速く（2.6→3.9）し、持久のタイプ差は
         実効持久を 1 に寄せて半分ほどに圧縮する：持久タイプでも
         ゲージが目に見えて減っていくようにする。衝突ダメージは不変 */
      var effStamina = 1 + (p.b.stamina - 1) * 0.5;
      var decay = dt * (3.9 / effStamina) * (0.8 + 0.25 * p.b.move);
      p.spin -= decay;
      if (p.spin < 0) p.spin = 0;
      if (p.clashCd > 0) p.clashCd -= dt;
      if (p.kickT > 0) p.kickT -= dt;
      if (p.jitterT > 0) p.jitterT -= dt;
      var speedRatio = p.spin / p.max;
      /* 緩急：モードを切り替え、速度は急に変えず滑らかに追いつかせる（加速・減速感） */
      p.modeT -= dt;
      if (p.modeT <= 0) pickMode(p);
      p.pace += (p.paceT - p.pace) * Math.min(1, dt*2.6);
      var foe = P[1-idx];
      /* 底が平らなベイは床を掴んで不意にダートする（激しい動きの源） */
      if (p.b.move > 1.2 && p.jitterT <= 0 && speedRatio > 0.25){
        var ja = Math.random()*Math.PI*2;
        var jolt = r * 0.38 * speedRatio;
        p.vx += Math.cos(ja)*jolt; p.vy += Math.sin(ja)*jolt;
        p.jitterT = 0.35 + Math.random()*0.55;
      }
      /* 中央に引き寄せつつ周回。尖った底は中心に留まりやすく、平らな底は外へ広がる */
      var dx = p.x-cx, dy = p.y-cy, d = Math.hypot(dx,dy)||1;
      var orbit = (140 * speedRatio + 20) * p.pace;
      var centerPull = 30 * (1.6 - 0.55 * p.b.move);
      p.vx += (-dy/d)*orbit*dt*2.2 - (dx/d)*speedRatio*dt*centerPull;
      p.vy += (dx/d)*orbit*dt*2.2 - (dy/d)*speedRatio*dt*centerPull;
      /* スタジアムは真ん中に向かってくぼんだお椀型：中心から離れるほど
         斜面に引かれて中心方向へ戻される（全ベイ共通の地形効果）。
         中心から遠いほど強く、回転が落ちる／時間が経つほど相対的に強まるので、
         終盤はどのベイもだんだん中心へ集まってくる */
      var bowlK = 0.22 + 0.85 * (1 - speedRatio) + 0.5 * Math.min(1, battleT / 24);
      p.vx += -(dx/d) * r * bowlK * (d / maxD) * dt;
      p.vy += -(dy/d) * r * bowlK * (d / maxD) * dt;
      /* アタック（底が平ら）は実物どおり、中心に留まらずスタジアム全体を
         大きなループで走り回る：目標半径が外⇔中ほどを行ったり来たりして
         花びら状の軌道になり、ときどき中心を横切って反対側まで突っ切る。
         防御・スタミナの周回は今まで通り */
      if (p.b.tip === "flat"){
        /* お椀の斜面で、渦の半径は試合経過とともにだんだん短くなる：
           ループの往復（速い）とは別に、往復の範囲そのもの（外側・内側とも）が
           ゆっくり縮んでいく。序盤はスタジアムの8割前後の大きなループ、
           終盤は2〜3割まで縮み、中心付近にいる防御・スタミナへ必ず届く */
        var shrink = Math.min(1, battleT / 18);
        var loopOuter = maxD * (1 - 0.60 * shrink);
        var loopInner = maxD * (0.42 + (0.15 - 0.42) * shrink);
        if (p.loopR == null){ p.loopR = loopOuter; p.loopDir = -1; p.crossT = 1.6 + Math.random()*1.8; p.crossX = null; }
        if (p.crossX != null){
          /* 突っ切り中：中心の向こう側の目標点へまっすぐ進む */
          var tx2 = p.crossX - p.x, ty2 = p.crossY - p.y, td = Math.hypot(tx2,ty2)||1;
          var rush = r * 1.9 * (0.4 + 0.6 * speedRatio);
          p.vx += (tx2/td)*rush*dt; p.vy += (ty2/td)*rush*dt;
          if (td < r * 0.08){ p.crossX = null; p.crossT = 2.2 + Math.random()*2.2; p.loopR = loopOuter; p.loopDir = -1; }
        } else {
          p.crossT -= dt;
          if (p.crossT <= 0 && speedRatio > 0.3){
            /* 中心を横切る：今いる位置の中心対称の点を目標にする */
            p.crossX = cx + (cx - p.x) * 0.85;
            p.crossY = cy + (cy - p.y) * 0.85;
          }
          /* 目標半径を行ったり来たりさせる。範囲は上の loopOuter/loopInner で
             時間とともに縮むので、中心へ寄り切らない序盤の動きを保ちつつ
             終盤は中心付近まで届く */
          p.loopR += p.loopDir * dt * r * 0.16 * (0.5 + 0.5 * speedRatio);
          if (p.loopR <= loopInner){ p.loopR = loopInner; p.loopDir = 1; }
          if (p.loopR >= loopOuter){ p.loopR = loopOuter; p.loopDir = -1; }
          if (d > p.loopR){
            var pull = Math.min((d - p.loopR) * 3.0, r * 0.55);
            p.vx += -(dx/d) * pull * dt;
            p.vy += -(dy/d) * pull * dt;
          } else if (d < p.loopR - r * 0.05){
            /* 内側に入りすぎたら外へ押し出し、大きなループを保つ */
            var push = Math.min((p.loopR - d) * 2.0, r * 0.4);
            p.vx += (dx/d) * push * dt;
            p.vy += (dy/d) * push * dt;
          }
        }
      }
      /* 防御（底が尖っている）は実物どおり中心のごく狭い範囲だけ：
         中心へ戻すバネを強め、外へ出てもすぐ小さな円に戻る */
      if (p.b.tip === "sharp"){
        p.vx += -dx * 3.2 * dt;
        p.vy += -dy * 3.2 * dt;
      }
      if (p.mode === "chase" && foe){
        /* 突進の速さは両方とも同じ */
        var fx = foe.x-p.x, fy = foe.y-p.y, fd = Math.hypot(fx,fy)||1;
        var chase = r * 1.5 * speedRatio * (0.5 + 0.5 * p.b.move);
        p.vx += (fx/fd)*chase*dt; p.vy += (fy/fd)*chase*dt;
      } else if (p.mode === "drift"){
        /* 流れるときは軽くブレーキをかけてゆっくりに */
        p.vx *= (1 - 0.9*dt); p.vy *= (1 - 0.9*dt);
      }
      /* 空気抵抗っぽい軽い減衰＋尖った底の安定感：大人しいベイほど勢いが暴れない */
      var calm = 0.22 + Math.max(0, 1 - p.b.move) * 0.45;
      p.vx *= (1 - calm*dt); p.vy *= (1 - calm*dt);
      var v = Math.hypot(p.vx,p.vy), vmax = r*(0.25+0.75*speedRatio) * (0.55 + 0.75*p.pace);
      if (p.kickT > 0) vmax *= 2.3; /* 弾かれた直後は勢いのまま遠くまで飛ぶ */
      if (v > vmax){
        if (p.kickT > 0){ var softCap = vmax + (v - vmax) * Math.max(0, 1 - dt*3); p.vx *= softCap/v; p.vy *= softCap/v; }
        else { p.vx *= vmax/v; p.vy *= vmax/v; }
      }
      p.x += p.vx*dt; p.y += p.vy*dt;
      var dd = Math.hypot(p.x-cx, p.y-cy);
      /* 行動半径：ディフェンスは内側で大人しく、アタックは壁際まで動き回る。
         ただし弾かれた直後（kickT）は全タイプ壁まで飛ぶ */
      var roamD = p.kickT > 0 ? maxD : maxD * p.b.roam;
      if (dd > roamD && p.kickT <= 0){
        var gx = (p.x-cx)/dd, gy = (p.y-cy)/dd;
        p.x = cx + gx*roamD; p.y = cy + gy*roamD;
        var gout = p.vx*gx + p.vy*gy;
        if (gout > 0){ p.vx -= gout*gx; p.vy -= gout*gy; }
        dd = roamD;
      }
      if (dd > maxD){
        var nx = (p.x-cx)/dd, ny = (p.y-cy)/dd;
        p.x = cx + nx*maxD; p.y = cy + ny*maxD;
        var dot = p.vx*nx + p.vy*ny;
        if (dot > 0){
          /* 壁にもバチンと弾かれる。削れ方は両方とも同じ */
          p.vx -= 1.9*dot*nx; p.vy -= 1.9*dot*ny;
          p.vx *= 0.94; p.vy *= 0.94;
          if (dot > r*0.4){ sparks(p.x, p.y, 6); SFX.clash(false); p.spin -= 1.2; }
        }
      }
      p.ang += dt * (p.me?1:-1) * p.spin * 0.55;
      p.el.style.transform = "translate("+(p.x-rad)+"px,"+(p.y-rad)+"px) rotate("+p.ang+"deg)";
      p.el.classList.toggle("wobble", speedRatio < 0.3 && p.spin > 0);
    });

    /* 衝突：本物みたいに両方が反対方向へ弾かれる */
    if (P.length===2){
      var a=P[0], b=P[1];
      var dx=b.x-a.x, dy=b.y-a.y, dist=Math.hypot(dx,dy);
      var hitDist = size*0.92;
      if (dist < hitDist && dist > 0.01){
        var nx=dx/dist, ny=dy/dist;
        /* めり込みを両方で半分ずつ押し戻す */
        var overlap = hitDist - dist;
        a.x -= nx*overlap/2; a.y -= ny*overlap/2;
        b.x += nx*overlap/2; b.y += ny*overlap/2;
        /* 法線方向の接近速度（正なら向かい合って近づいている） */
        var van = a.vx*nx + a.vy*ny, vbn = b.vx*nx + b.vy*ny;
        var approach = van - vbn;
        if (approach > 0 && a.clashCd <= 0 && b.clashCd <= 0){
          var hard = approach > r*0.32;
          /* 弾性衝突：法線成分を入れ替えるように両方を跳ね返す（反発係数つき） */
          var rest = hard ? 0.96 : 0.88;
          var impulse = (1 + rest) * approach / 2;
          a.vx -= impulse*nx; a.vy -= impulse*ny;
          b.vx += impulse*nx; b.vy += impulse*ny;
          /* ノックバック：両方とも同じだけ弾かれる */
          var avgSpin = (a.spin/a.max + b.spin/b.max) / 2;
          var kick = r * (0.16 + 0.30*avgSpin) + approach * 0.28;
          a.vx -= nx*kick; a.vy -= ny*kick;
          b.vx += nx*kick; b.vy += ny*kick;
          /* 横方向のキック：当たったあとカーブして離れる、本物のベイらしい動き */
          var tx = -ny, ty = nx;
          var swerve = (Math.random()*0.7 + 0.5) * r * 0.22 * (Math.random() < 0.5 ? 1 : -1);
          a.vx += tx*swerve; a.vy += ty*swerve;
          b.vx -= tx*swerve; b.vy -= ty*swerve;
          /* 弾かれた直後は二人とも一瞬ゆっくりに見せてから勢いよく離れる */
          a.clashCd = 0.18; b.clashCd = 0.18;
          a.kickT = 0.5; b.kickT = 0.5;
          /* 弾かれたアタックは、また外側から大きなループで戻ってくる */
          if (a.b.tip === "flat"){ a.loopR = maxD; a.loopDir = -1; a.crossX = null; }
          if (b.b.tip === "flat"){ b.loopR = maxD; b.loopDir = -1; b.crossX = null; }
          if (hard) slowmoT = 0.13;
          /* 弾かれた後は少し休んでからまた動き出す（間） */
          a.mode = "drift"; a.paceT = 0.5; a.modeT = 0.45 + Math.random()*0.3;
          b.mode = "drift"; b.paceT = 0.5; b.modeT = 0.45 + Math.random()*0.3;
          /* ダメージ：両者まったく同じ計算（差は基礎ステータスの倍率だけ） */
          var dmgA = (3.5 + Math.random()*4.5) * b.b.power * (hard?1.5:1.1);
          var dmgB = (3.5 + Math.random()*4.5) * a.b.power * (hard?1.5:1.1);
          a.spin -= dmgA; b.spin -= dmgB;
          sparks((a.x+b.x)/2, (a.y+b.y)/2, hard?14:8);
          ringFx((a.x+b.x)/2, (a.y+b.y)/2);
          SFX.clash(hard);
          if (navigator.vibrate) navigator.vibrate(hard?60:25);
          /* バースト：閾値も確率も両者まったく同じ */
          if (hard){
            if (a.spin < a.max*0.22 && Math.random()<0.35) return finish(a, true);
            if (b.spin < b.max*0.22 && Math.random()<0.35) return finish(b, true);
          } else {
            /* 通常ヒットでも、残りわずかなら両方とも たまにバーストする */
            if (a.spin < a.max*0.12 && Math.random()<0.14) return finish(a, true);
            if (b.spin < b.max*0.12 && Math.random()<0.14) return finish(b, true);
          }
        } else if (approach > 0){
          /* クールダウン中はすり抜けず、軽く押し合いだけ続ける */
          var soft = approach * 0.5;
          a.vx -= nx*soft; a.vy -= ny*soft;
          b.vx += nx*soft; b.vy += ny*soft;
        }
      }
    }
    updateGauges();

    var loser = null;
    P.forEach(function(p){ if (p.spin <= 0.5) loser = p; });
    if (loser) return finish(loser, false);

    raf = requestAnimationFrame(tick);
  }

  function sparks(x,y,n){
    for (var i=0;i<n;i++){
      var s = document.createElement("div");
      s.className = "spark";
      s.style.left = x+"px"; s.style.top = y+"px";
      stadium.appendChild(s);
      var a = Math.random()*Math.PI*2, d = 26+Math.random()*54;
      s.animate([
        { transform:"translate(0,0) scale(1)", opacity:1 },
        { transform:"translate("+(Math.cos(a)*d)+"px,"+(Math.sin(a)*d)+"px) scale(.2)", opacity:0 }
      ], { duration:260+Math.random()*220, easing:"ease-out" });
      setTimeout((function(el){ return function(){ el.remove(); }; })(s), 520);
    }
  }
  function ringFx(x,y){
    var s = document.createElement("div");
    s.className = "ringFx"; s.style.left = x+"px"; s.style.top = y+"px";
    stadium.appendChild(s);
    setTimeout(function(){ s.remove(); }, 480);
  }

  /* ===== ブースト ===== */
  /* ブースト：回転が+10戻り、相手へ強く突っ込める。再使用は1.1秒 */
  function boost(){
    if (state !== "battle" || !boostReady) return;
    var me = P[0], foe = P[1]; if(!me || !foe) return;
    me.spin = Math.min(me.max, me.spin + 10);
    var dx = foe.x-me.x, dy = foe.y-me.y, d = Math.hypot(dx,dy)||1;
    var r = stadium.clientWidth;
    me.vx += dx/d*r*0.55; me.vy += dy/d*r*0.55;
    me.kickT = 0.35; me.mode = "chase"; me.paceT = 1.5; me.modeT = 0.6;
    SFX.boost();
    sparks(me.x, me.y, 7);
    boostReady = false; tapBtn.classList.add("cool");
    setTimeout(function(){ boostReady = true; tapBtn.classList.remove("cool"); }, 1100);
  }
  tapBtn.addEventListener("click", boost);
  stadium.addEventListener("pointerdown", function(){ if (state==="battle") boost(); });

  /* ===== ゲージ ===== */
  var fillYou = document.querySelector("#gYou .fill");
  var fillCpu = document.querySelector("#gCpu .fill");
  function updateGauges(){
    if (!P.length) return;
    fillYou.style.width = Math.max(0, P[0].spin/P[0].max*100) + "%";
    fillCpu.style.width = Math.max(0, P[1].spin/P[1].max*100) + "%";
  }

  /* ===== 終了 ===== */
  function finish(loser, burst){
    state = "end";
    if (raf) cancelAnimationFrame(raf);
    tapBtn.style.display = "none";
    var winner = (loser === P[0]) ? P[1] : P[0];
    var iWin = winner.me;

    if (burst){
      SFX.burst();
      if (navigator.vibrate) navigator.vibrate([80,40,120]);
      loser.el.innerHTML = beyPiecesHTML(loser.b);
      var dirs = [[-1,-1],[ -1.4,0.4],[1,1]];
      var pieces = loser.el.querySelectorAll(".piece");
      pieces.forEach(function(pc, i){
        pc.style.transform = "translate("+(dirs[i][0]*70)+"px,"+(dirs[i][1]*70)+"px) rotate("+(i*70-60)+"deg)";
        pc.style.opacity = "0.25";
      });
      sparks(loser.x, loser.y, 22);
    } else {
      SFX.spinout();
      loser.el.classList.add("wobble");
    }
    /* 勝者は回り続ける */
    var start = performance.now();
    (function celeb(now){
      if (state !== "end") return;
      var t = (now-start)/1000;
      winner.ang += 0.25;
      var r = stadium.clientWidth, rad = r*0.162/2;
      winner.el.style.transform = "translate("+(winner.x-rad)+"px,"+(winner.y-rad)+"px) rotate("+winner.ang+"deg) scale("+(1+Math.sin(t*6)*0.05)+")";
      if (t < 1.6) requestAnimationFrame(celeb);
    })(start);

    setTimeout(function(){
      document.getElementById("resBig").textContent = iWin ? "🏆 かった！！" : "まけた…";
      document.getElementById("resSub").textContent =
        burst ? (iWin ? (cpuStrong ? "ボスに バースト勝ち！ ほんものだ！" : "バースト勝ち！ やったね！") : "バーストで まけた。つぎは かてるよ！")
              : (iWin ? (cpuStrong ? "ボスに スピン勝ち！ すごい！" : "スピン勝ち！ かいてんが のこった！") : "とまって まけた。つぎは かてるよ！");
      resultEl.style.display = "flex";
      if (iWin){ SFX.win(); confetti(); } else { SFX.lose(); }
    }, burst ? 900 : 1100);
  }

  function confetti(){
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var colors = ["#ef4444","#3b82f6","#22c55e","#facc15","#f472b6","#38bdf8"];
    for (var i=0;i<70;i++){
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = (Math.random()*100)+"vw";
      c.style.background = colors[i%colors.length];
      var sz = 8+Math.random()*10;
      c.style.width = sz+"px"; c.style.height = sz*0.6+"px";
      c.style.animationDuration = (1.6+Math.random()*1.6)+"s";
      c.style.animationDelay = (Math.random()*0.5)+"s";
      document.body.appendChild(c);
      setTimeout((function(el){ return function(){ el.remove(); }; })(c), 4200);
    }
  }

  /* ===== リセット ===== */
  function reset(){
    state = "pick";
    slowmoT = 0;
    cpuBoostT = 1.0;
    if (raf) cancelAnimationFrame(raf);
    resultEl.style.display = "none";
    gauges.style.display = "none";
    document.querySelector("#gCpu .who").textContent = "あいて 🤖";
    document.getElementById("pick").style.display = "block";
    shootBtn.style.display = "block";
    shootBtn.disabled = !myBey;
    tapBtn.style.display = "none";
    hintEl.textContent = myBey ? "したの あかいボタンを おしてね！" : "ベイを えらぶと シュートできるよ";
    if (myBey) preview(); else clearStage();
  }
  document.getElementById("againBtn2").addEventListener("click", function(){ audio(); SFX.pick(); reset(); });

  /* スクロールと引っ張り更新を止めて、画面を固定する */
  document.addEventListener("touchmove", function(e){ e.preventDefault(); }, { passive:false });
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); });

  window.addEventListener("resize", function(){
    fitStadium();
    if (state==="pick" && myBey) preview();
  });
  fitStadium();
})();
</script>
</body>
</html>
