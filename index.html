<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#a9bcd6" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090f19" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="ベイブレード" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230d1523'/%3E%3Ccircle cx='50' cy='50' r='33' fill='none' stroke='%23c7d2e2' stroke-width='10'/%3E%3Ccircle cx='50' cy='50' r='18' fill='%23ef3f16'/%3E%3Ccircle cx='50' cy='50' r='7' fill='%23f4f8ff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet" />
<title>ベイブレード</title>
<style>
  :root{
    /* 金属スタジアム×熱い対戦：基調はスチール（青灰の金属）、
       アクセントは熱のオレンジ赤だけに絞る。タイプ色はラベルの差し色のみ */
    /* 画面地は単色フラットに統一する（以前の上下グラデーション＋
       細い斜めラインは、上部が白っぽく霞んで見える原因だった） */
    --bg:#a9bcd6; --bg2:#8ea2bf;
    --panel:#e9eef6; --panel2:#cfdaeb;
    --ink:#131e30; --sub:#43536c;
    --arena:#22355e; --arena2:#16233f; --ring:#46587a;
    --accent:#ef3f16; --accent-hi:#ff8a3c; --accent-dk:#b91f06;
    --gold:#b97a08;
    --line:#8b9eb9;
    --card-border:#8498b3;
    --disp:"Anton","Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#090f19; --bg2:#060a12;
      --panel:#182335; --panel2:#101827;
      --ink:#eef3fb; --sub:#93a5c0;
      --arena:#1b2c50; --arena2:#101c36; --ring:#46639f;
      --gold:#f5b942;
      --line:#2e3e56;
      --card-border:#2e3e56;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overscroll-behavior:none;}
  /* html 自体にも地色を付ける：ステータスバー裏やセーフエリアで
     白地が透けて上部だけ白く浮くのを防ぐ */
  html{background:var(--bg);}
  body{
    position:fixed; inset:0; width:100%;
    margin:0; color:var(--ink);
    /* 地はスチール単色フラット。グラデーションと斜めラインは
       上部の霞みの原因になるので敷かない（質感はカード側で出す） */
    background:var(--bg);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  #app{
    height:100dvh; max-width:1080px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom)); gap:10px;
  }

  /* ---------- えらぶ画面 ---------- */
  /* 選択画面ではスタジアムを出さない：空いた高さを全部グリッドに使う */
  #pick{width:100%; text-align:center; flex:1; display:flex; flex-direction:column; min-height:0;}
  /* 見出しはディスプレイ書体で大きく。「えらべ！」だけ熱色で感情を付ける */
  #pick .lead{font-family:var(--disp); font-size:clamp(32px,7.2vw,50px); font-weight:900; letter-spacing:.03em; margin:6px 0 2px; text-shadow:0 3px 0 rgba(10,18,34,.16); max-width:100%; overflow:hidden;}
  #pick .lead em{font-style:normal; color:var(--accent); font-size:1.14em; text-shadow:0 3px 0 rgba(120,15,0,.28);}
  #pick .lead small{display:block; font-family:"Zen Kaku Gothic New",sans-serif; font-size:clamp(14px,3.6vw,19px); color:var(--sub); font-weight:700; letter-spacing:.14em; margin-top:5px; text-shadow:none;}
  /* 9種を3×3グリッドで大きく並べる：ステージが無いぶんカードも文字も拡大 */
  #beyChoices{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(3,minmax(0,1fr)); gap:12px; margin:14px auto 0; width:100%; max-width:880px; flex:1; min-height:0;}
  /* カードは金属プレート：角は締めて、上端に光のエッジ、下端に影の段差 */
  .choice{
    position:relative; overflow:hidden;
    border:2px solid var(--card-border);
    background:linear-gradient(165deg, var(--panel) 0%, var(--panel2) 100%);
    border-radius:14px;
    min-width:0; min-height:132px; padding:12px 6px 10px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    font-family:inherit; color:var(--ink);
    box-shadow:0 4px 0 rgba(10,18,34,.28), 0 10px 20px rgba(10,18,34,.14), inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .choice::before{content:""; position:absolute; top:0; left:10%; right:10%; height:3px; background:linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);}
  .choice:active{transform:scale(.95);}
  .choice.sel{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent), 0 0 0 6px rgba(239,63,22,.22), 0 12px 26px rgba(10,18,34,.25); transform:scale(1.04);}
  /* カード幅に必ず収まる文字サイズにする（名前が枠にはみ出して重なるのを防ぐ）。
     基本は従来サイズ、長い名前ほど段階的に小さくする（data-len＝文字数）。
     さらにJSの実測フィットが最終保証として効くので、どの幅でも見切れない */
  .choice .cname{font-family:var(--disp); font-size:clamp(13px,4.3vw,25px); font-weight:900; white-space:nowrap; max-width:100%; width:100%; display:block; text-align:center; overflow:hidden; letter-spacing:0;}
  .choice .cname[data-len="7"]{font-size:clamp(12px,3.9vw,25px);}
  .choice .cname[data-len="8"]{font-size:clamp(11px,3.35vw,25px);}
  .choice .cname[data-len="9"]{font-size:clamp(10px,3vw,23px);}
  /* タイプラベルは4タイプで色分け（差し色はここだけに限定する）：
     アタック=赤／スタミナ=青／ディフェンス=緑／バランス=紫 */
  .choice .ctype{font-size:clamp(11px,3vw,15px); font-weight:900; color:var(--sub); white-space:nowrap; max-width:100%; overflow:hidden; padding:3px 8px; border-radius:6px; letter-spacing:.04em;}
  .choice .ctype.t-atk{background:rgba(239,68,68,.16); color:#c81e1e;}
  .choice .ctype.t-sta{background:rgba(59,130,246,.16); color:#1d4ed8;}
  .choice .ctype.t-def{background:rgba(34,197,94,.18); color:#15803d;}
  .choice .ctype.t-bal{background:rgba(168,85,247,.16); color:#7e22ce;}
  @media (prefers-color-scheme: dark){
    .choice .ctype.t-atk{color:#fca5a5;}
    .choice .ctype.t-sta{color:#93c5fd;}
    .choice .ctype.t-def{color:#86efac;}
    .choice .ctype.t-bal{color:#d8b4fe;}
  }
  .choice svg{width:clamp(68px,18vw,104px); height:clamp(68px,18vw,104px);}

  /* ---------- スタジアム ---------- */
  /* 既定は非表示（選択画面）。バトル開始時にJSで display:flex にする */
  #stageWrap{flex:1; width:100%; display:none; align-items:center; justify-content:center; min-height:0;}
  #stadium{
    position:relative; border-radius:50%; flex:none;
    width:280px; height:280px;
    background:radial-gradient(circle at 50% 42%, var(--arena) 0 55%, var(--arena2) 78%, #0a1226 100%);
    /* 外周は金属リムの段重ね（明→暗→明）でスタジアムの縁を表現する */
    box-shadow:0 24px 48px rgba(5,10,22,.5), 0 0 0 6px #3b4c6b, 0 0 0 11px #131e31, 0 0 0 14px #5a6f92, inset 0 0 0 10px var(--ring), inset 0 0 60px rgba(0,0,0,.45);
    overflow:hidden; touch-action:none;
  }
  #stadium::before{
    content:""; position:absolute; inset:16%; border-radius:50%;
    border:3px dashed rgba(255,255,255,.14);
  }
  #stadium::after{
    content:""; position:absolute; inset:38%; border-radius:50%;
    border:3px solid rgba(255,255,255,.10);
  }
  .bey{
    position:absolute; width:16.2%; aspect-ratio:1/1; left:0; top:0;
    will-change:transform; pointer-events:none; z-index:3;
  }
  .bey svg{width:100%; height:100%; display:block; filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));}
  .bey.strong svg{filter:drop-shadow(0 0 16px rgba(255,190,0,.95)) drop-shadow(0 8px 10px rgba(0,0,0,.45));}
  .bey.wobble svg{animation:wob .28s ease-in-out infinite alternate;}
  @keyframes wob{from{margin-left:-4px;}to{margin-left:4px;}}
  .bey .piece{position:absolute; inset:0; transition:transform .7s cubic-bezier(.2,.8,.3,1), opacity .7s;}
  .spark{
    position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
    background:radial-gradient(circle,#ffffff 0 22%, #fff3b0 34%, #ffd23f 52%, rgba(255,140,0,0) 74%);
    box-shadow:0 0 0 1.5px rgba(70,35,0,.55), 0 0 7px rgba(255,180,0,.85);
    pointer-events:none; z-index:5;
  }
  .spark.big{width:20px; height:20px; margin:-10px 0 0 -10px;}
  /* ヒットマーク：明るい芯＋暗い縁で、明暗どちらの背景でも見える衝撃波。
     ベイを隠しすぎないよう小さめ・短めに消す（通常0.3秒／強ヒット0.42秒） */
  .ringFx{
    position:absolute; border:3px solid #fff6c9; border-radius:50%;
    box-shadow:0 0 0 2px rgba(30,20,60,.55), inset 0 0 0 2px rgba(255,160,0,.55), 0 0 12px rgba(255,200,40,.7);
    pointer-events:none; z-index:4; transform:translate(-50%,-50%);
    animation:ringOut .3s ease-out forwards;
  }
  .ringFx.hard{border-width:5px; animation-duration:.42s;}
  @keyframes ringOut{from{width:16px;height:16px;opacity:1;}to{width:96px;height:96px;opacity:0;}}
  .ringFx.hard{animation-name:ringOutHard;}
  @keyframes ringOutHard{from{width:20px;height:20px;opacity:1;}to{width:148px;height:148px;opacity:0;}}
  /* 当たった瞬間の白い芯：一瞬だけ光ってすぐ消える */
  .hitCore{
    position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%;
    background:radial-gradient(circle,#ffffff 0 38%, rgba(255,230,140,.85) 58%, rgba(255,180,0,0) 76%);
    box-shadow:0 0 0 2px rgba(70,35,0,.35), 0 0 18px rgba(255,210,60,.95);
    pointer-events:none; z-index:6;
    animation:coreOut .16s ease-out forwards;
  }
  .hitCore.hard{width:44px; height:44px; margin:-22px 0 0 -22px; animation-duration:.22s;}
  @keyframes coreOut{from{transform:scale(.55); opacity:1;}to{transform:scale(1.5); opacity:0;}}
  /* バースト時のフラッシュ：画面全体が一瞬白く光る */
  #flash{
    position:absolute; inset:0; background:#fffbe8; opacity:0;
    pointer-events:none; z-index:7;
  }
  #count{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    font-family:var(--disp);
    font-size:clamp(84px,23vw,180px); font-weight:900; color:#fff; z-index:8;
    -webkit-text-stroke:3px rgba(185,31,6,.85);
    text-shadow:0 7px 0 rgba(120,10,0,.5), 0 0 48px rgba(255,140,40,.9); pointer-events:none;
    text-align:center; line-height:1.05;
  }
  #count.pop{animation:cpop .5s ease;}
  @keyframes cpop{0%{transform:scale(1.7) rotate(-5deg);}100%{transform:scale(1) rotate(-3deg);}}

  /* ---------- たいりょくゲージ ---------- */
  #gauges{width:min(92vw,720px); display:none; gap:10px;}
  .gauge{flex:1;}
  /* ゲージは金属の溝にエネルギーが流れる見た目：暗い溝＋斜めストライプの充填 */
  .gauge .bar{height:24px; border-radius:7px; background:#0b1322; overflow:hidden; border:2px solid var(--line); box-shadow:inset 0 3px 7px rgba(0,0,0,.65), 0 2px 6px rgba(0,0,0,.2);}
  .gauge .fill{height:100%; width:100%; transition:width .18s linear;}
  #gYou .fill{background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.22) 0 8px, transparent 8px 16px), linear-gradient(90deg,#4cc9ff,#2563eb);}
  #gCpu .fill{background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.22) 0 8px, transparent 8px 16px), linear-gradient(90deg,#ffb03a,#e63312);}
  .gauge .who{font-family:var(--disp); font-size:17px; font-weight:900; letter-spacing:.08em; text-align:center; margin-top:4px; white-space:nowrap; overflow:hidden; max-width:100%;}
  .gauge .who.you{color:#1d6fd1;}
  .gauge .who.cpu{color:#d93a2b;}
  .gauge .who.boss{color:var(--gold);}
  @media (prefers-color-scheme: dark){
    .gauge .who.you{color:#6fc3ff;}
    .gauge .who.cpu{color:#ff8a75;}
  }

  /* ---------- ボタン ---------- */
  #controls{width:min(92vw,720px); display:flex; flex-direction:column; gap:10px; align-items:stretch;}
  .bigbtn{
    border:none; cursor:pointer; font-family:var(--disp); font-weight:900; color:#fff;
    border-radius:16px; min-height:76px; font-size:clamp(26px,6.5vw,36px);
    letter-spacing:.06em; padding:10px 18px;
    box-shadow:0 7px 0 rgba(8,12,22,.38), 0 16px 30px rgba(8,12,22,.28);
    transition:transform .08s ease, box-shadow .08s ease, filter .15s;
  }
  .bigbtn:active{transform:translateY(5px); box-shadow:0 2px 0 rgba(8,12,22,.38);}
  .btnIn{display:inline-block; transform:skewX(-6deg);}
  /* 主アクションは画面で一番大きく・一番熱く（階層はサイズで表現する） */
  #shootBtn{
    min-height:98px; font-size:clamp(34px,8.5vw,48px); letter-spacing:.08em;
    text-shadow:0 3px 0 rgba(120,15,0,.45);
    background-image:linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,0) 46%), linear-gradient(180deg,var(--accent-hi),var(--accent) 55%,var(--accent-dk));
  }
  #shootBtn:disabled{filter:grayscale(.75) brightness(.72);}
  /* ねばりボタン：バトル中だけ出る。押すと自分のゲージの減りが一時的に遅くなる */
  #gutsBtn{background-image:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 46%), linear-gradient(180deg,#2fbf71,#128a43 60%,#0b6b32); display:none; min-height:68px; font-size:clamp(24px,6vw,32px);}
  #gutsBtn.on{box-shadow:0 7px 0 rgba(8,12,22,.38), 0 0 26px rgba(74,222,128,.95), 0 14px 28px rgba(0,0,0,.2);}
  #gutsBtn:active{transform:translateY(5px) scale(.97);}
  #gutsBtn.pop{animation:gpop .3s ease;}
  @keyframes gpop{0%{transform:scale(1.1);}100%{transform:scale(1);}}
  #gutsBtn.dud{animation:gdud .3s ease;}
  @keyframes gdud{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .bey.guts svg{filter:drop-shadow(0 0 18px rgba(74,222,128,.95)) drop-shadow(0 8px 10px rgba(0,0,0,.45));}
  /* ねばり中は自分のゲージも緑に光って、効いているのがひと目で分かる */
  #gYou.gutsOn .bar{border-color:#4ade80; box-shadow:0 0 16px rgba(74,222,128,.9), 0 2px 8px rgba(0,0,0,.15); animation:gpulse .5s ease-in-out infinite alternate;}
  @keyframes gpulse{from{box-shadow:0 0 8px rgba(74,222,128,.6), 0 2px 8px rgba(0,0,0,.15);}to{box-shadow:0 0 22px rgba(74,222,128,1), 0 2px 8px rgba(0,0,0,.15);}}
  #againBtn2{background-image:linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 46%), linear-gradient(180deg,#ffb03a,#f07f13 55%,#d95f06); font-size:clamp(20px,5.6vw,32px); white-space:nowrap; overflow:hidden;}
  .hintline{text-align:center; font-size:clamp(13px,3.6vw,18px); font-weight:700; letter-spacing:.03em; color:var(--sub); min-height:1.4em; max-width:100%; overflow-wrap:break-word; padding:0 2px;}

  /* ---------- けっか ---------- */
  #result{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    /* 半透明だと下の淡い地が透けて画面全体が乳白色に霞むので、
       ほぼ不透明な均一の暗色ベールにしてカードだけを浮かせる */
    background:rgba(5,9,18,.88); z-index:20; padding:20px;
  }
  #result .card{
    background:linear-gradient(165deg, var(--panel), var(--panel2));
    border:2px solid var(--line);
    border-radius:20px; padding:26px 22px; text-align:center;
    max-width:420px; width:100%; box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35);
    animation:rin .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes rin{from{transform:scale(.7); opacity:0;}to{transform:scale(1); opacity:1;}}
  /* 勝敗の一言は最大級に。勝ちは熱色＋影で感情を付ける */
  #result .big{font-family:var(--disp); font-size:clamp(44px,11vw,66px); font-weight:900; line-height:1.15; letter-spacing:.03em;}
  #result .big.win{color:var(--accent); text-shadow:0 4px 0 rgba(120,15,0,.25);}
  #result .sub{font-size:clamp(16px,4.4vw,20px); font-weight:700; color:var(--sub); margin:10px 0 18px; max-width:100%; overflow-wrap:break-word;}
  /* バースト決着のときだけ、決まり文句を傾けた熱色チップにして山場を強調する */
  #result .sub.burst{display:inline-block; background:linear-gradient(180deg,var(--accent-hi),var(--accent) 60%,var(--accent-dk)); color:#fff; font-weight:900; padding:9px 18px; border-radius:8px; transform:rotate(-2deg); box-shadow:0 5px 0 rgba(8,12,22,.35); text-shadow:0 2px 0 rgba(120,15,0,.4);}
  #result .bigbtn{width:100%;}
  .confetti{position:fixed; top:-4vh; z-index:21; pointer-events:none; border-radius:3px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg);}}
  @media (prefers-reduced-motion: reduce){
    .confetti{display:none;}
  }
  /* 狭い画面ではカードの余白と枠を詰めて、文字がはみ出さないようにする */
  @media (max-width:480px){
    #beyChoices{gap:8px;}
    .choice{border-width:2px; padding:8px 2px 6px; border-radius:12px; min-height:118px;}
    .choice .ctype{padding:3px 6px; letter-spacing:.02em;}
  }
  /* やや背の低い画面では9種グリッドを少し詰める（ステージが無いので以前より緩めでよい） */
  @media (max-height:840px){
    .choice{min-height:112px; padding:8px 2px 6px; gap:4px;}
    .choice svg{width:clamp(56px,14vw,80px); height:clamp(56px,14vw,80px);}
    #pick .lead{margin:2px 0 0;}
    #beyChoices{margin-top:10px;}
  }
  /* 背の低い画面でもスクロールせず収まるように詰める */
  @media (max-height:620px){
    #app{gap:6px; padding-top:calc(6px + env(safe-area-inset-top));}
    #pick .lead{font-size:26px; margin:2px 0 0;}
    #pick .lead small{font-size:13px;}
    #beyChoices{margin-top:8px; gap:8px;}
    .choice{min-height:96px; padding:6px 2px; gap:3px;}
    .choice svg{width:clamp(48px,13vw,64px); height:clamp(48px,13vw,64px);}
    .bigbtn{min-height:60px;}
    /* 低い画面でも主アクションの大きさは死守する */
    #shootBtn{min-height:78px; font-size:30px;}
  }
</style>
</head>
<body>
<div id="app">

  <div id="pick">
    <p class="lead">ベイを <em>えらべ！</em><small>すきなベイを タップ</small></p>
    <div id="beyChoices"></div>
  </div>

  <div id="stageWrap">
    <div id="stadium">
      <div id="flash"></div>
      <div id="count"></div>
    </div>
  </div>

  <div id="gauges">
    <div class="gauge" id="gYou"><div class="bar"><div class="fill"></div></div><div class="who you">きみ</div></div>
    <div class="gauge" id="gCpu"><div class="bar"><div class="fill"></div></div><div class="who cpu">あいて</div></div>
  </div>

  <div id="controls">
    <div class="hintline" id="hint">ベイを えらぶと シュートできるよ</div>
    <button class="bigbtn" id="shootBtn" disabled><span class="btnIn">シュート！</span></button>
    <button class="bigbtn" id="gutsBtn" type="button">ねばる！</button>
  </div>
</div>

<div id="result">
  <div class="card">
    <div class="big" id="resBig">かった！！</div>
    <div class="sub" id="resSub">あいてが バラバラに なった！</div>
    <button class="bigbtn" id="againBtn2">もういちど たたかう</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ===== ベイのデータ（オリジナル） =====
     性能はタイプ特性として両者まったく同じルールで効く：
       atk   = ぶつかったときに相手のゲージを削る力（与ダメージ倍率）
       decay = ゲージの自然な減り（1秒あたり。大きいほど早く止まる）
       guard = ぶつかったときに自分のゲージが削られる量（被ダメージ倍率。
               小さいほど硬い＝削りガードが強い）
     動きは底の形（tip）で決まる：
       flat（アタック）    = 大きくグルグル周回し、2周したら半径が縮んで中心へ寄る
       round（スタミナ）   = 基本は真ん中、小さな円だけ
       sharp（防御）       = その中間、中くらいの半径で穏やかに周回
       balance（バランス） = 中くらいの半径（約55%）で回り、終盤に
                             約35%までゆるやかにだけ縮む */
  /* 全9種（攻撃3／持久2／防御2／バランス2）。タイプの土台は共通マトリクス：
       アタック   = atk高め／decay速め／周回は大回り→縮小（flat）
       スタミナ   = decay遅め／guard受けやすい（大きめ）／中心寄り（round）
       ディフェンス = atk低め〜中／guard受けにくい（小さめ）／中間周回（sharp）
       バランス   = 全部中庸（atk約1.0／decay普通／guard約1.0）／
                    半径約55%→終盤約35%へゆるやかに縮小（balance）
     その上で各種に個性を付けるが、極端な強弱にならない範囲に収める。
     speedMul はタイプ共通の周回スピードへの倍率（個性付け専用、既定1） */
  /* 並び順はタイプごとにまとめる（選択画面でタイプで選びやすく） */
  var BEYS = [
    { id:"red",   name:"ほのおドラゴン", type:"アタック",     tip:"flat", main:"#ef4444", dark:"#991b1b", light:"#fca5a5", blades:3, atk:1.3,  decay:5.0, guard:1.0,  speedMul:1.0 },
    /* かみなりウルフ：素早い攻撃。周回が速く当たる回数は多いが、
       一撃はアタック内でやや軽く、decayも速めで息切れしやすい */
    { id:"yellow", name:"かみなりウルフ", type:"アタック",     tip:"flat", main:"#eab308", dark:"#854d0e", light:"#fef08a", blades:5, atk:1.15, decay:5.6, guard:1.05, speedMul:1.25 },
    /* メタルライノ：重い一撃。atkは全ベイ最高クラスで少し硬いが、
       decayは最速クラスで長くは回れない。周回は重くゆっくり */
    { id:"silver", name:"メタルライノ",   type:"アタック",     tip:"flat", main:"#9ca3af", dark:"#374151", light:"#e5e7eb", blades:2, atk:1.55, decay:6.0, guard:0.85, speedMul:0.9 },
    { id:"blue",  name:"うみウェーブ",   type:"スタミナ",     tip:"round",main:"#3b82f6", dark:"#1e3a8a", light:"#93c5fd", blades:4, atk:0.7,  decay:1.8, guard:1.3,  speedMul:1.0 },
    /* ゆきペンギン：超持久。decayは全ベイ最遅で、周回も全ベイ最遅
       （speedMul 0.6）。遅く回ることで正面衝突の回数と激しさが落ち、
       中心でジッと粘り続けられるのが本体。atkは低め、guardは
       スタミナ標準どおり受けやすい。以前は速く回っていたため
       いわゴーレムに正面から削り切られていたが、この組み合わせで
       ゴーレム相手でも粘り勝ちできるようになった（要シミュレーション確認済み） */
    { id:"yuki",   name:"ゆきペンギン",   type:"スタミナ",     tip:"round",main:"#7dd3fc", dark:"#0369a1", light:"#f0f9ff", blades:8, atk:0.65, decay:1.2, guard:1.3,  speedMul:0.6 },
    { id:"green", name:"もりタートル",   type:"ディフェンス", tip:"sharp",main:"#22c55e", dark:"#14532d", light:"#86efac", blades:6, atk:0.9,  decay:2.6, guard:0.6,  speedMul:1.0 },
    /* いわゴーレム：超硬い。guardは全ベイ最良（0.4）でほとんど削られず、
       攻撃タイプの火力をいなして勝つ。その代わり atk は全ベイ最低で
       持久タイプを倒し切れず、decay も普通〜やや速め（タートルより速い）
       まで戻したので、持久相手には粘り負ける（相性サイクル
       「攻撃＞持久＞防御＞攻撃」を成立させるための調整。
       以前は decay が防御標準より遅く atk も効きすぎていて、
       持久が全く勝てなかった） */
    { id:"iwa",    name:"いわゴーレム",   type:"ディフェンス", tip:"sharp",main:"#b45309", dark:"#78350f", light:"#fcd9a8", blades:4, atk:0.55, decay:3.6, guard:0.4,  speedMul:0.9 },
    /* ほしのユニコーン：バランス内で持久寄り。ステータスは中庸
       （atk約1.0／guard標準1.0）で、decayだけやや遅め */
    { id:"hoshi",  name:"ほしのユニコーン", type:"バランス",     tip:"balance",main:"#a855f7", dark:"#581c87", light:"#e9d5ff", blades:7, atk:1.0,  decay:2.2, guard:1.0,  speedMul:1.05 },
    /* はがねカブト：バランス内でカウンター寄り。atkはやや高め（約1.1）、
       guardは標準よりほんの少しだけ良く、decayは普通 */
    { id:"kabuto", name:"はがねカブト",   type:"バランス",     tip:"balance",main:"#2b2b2b", dark:"#92600a", light:"#facc15", blades:6, atk:1.1,  decay:2.6, guard:0.9,  speedMul:1.05 }
  ];
  /* ゲージ満タン量（プレイヤー側）。CPU側は基礎倍率ぶんだけ変わる（通常戦は1.25倍、ボス戦は合計で約1.48倍） */

  function beySVG(b){
    /* ほぼ円の形：回っているところを上から見ると円っぽく見えるので、
       輪郭はうっすら波打つだけの、ほぼ真円のシルエットにする。
       半径は 79〜86 の範囲で刃の数だけゆるく波打つ（出っ張りは約7、
       以前のコブ状の輪郭＝土台66から約20の半分以下）。全体の大きさ
       （最大半径86）は前と同じ。タイプの区別は輪郭ではなく、
       内側のドットの数と色で残す。
       中心(100,100)から半径r・角度degの点を返す */
    function C(r, deg){
      var rad = (deg-90)*Math.PI/180;
      return [100 + r*Math.cos(rad), 100 + r*Math.sin(rad)];
    }
    /* 輪郭：細かく点を打って滑らかにつないだ、ほぼ円のパス */
    var outline = "";
    var steps = b.blades * 16;
    for (var i=0;i<steps;i++){
      var deg = 360 * i / steps;
      var rr = 82.5 + 3.5 * Math.cos(b.blades * (deg-90) * Math.PI/180);
      var pt = C(rr, deg);
      outline += (i===0 ? "M" : "L") + pt[0].toFixed(1) + " " + pt[1].toFixed(1);
    }
    outline += "Z";
    /* 内側の模様：刃の数だけドットをリング状に並べる（輪郭では区別しない） */
    var dots = "";
    var step = 360 / b.blades;
    for (var j=0;j<b.blades;j++){
      var dp = C(49, step*j);
      dots += '<circle cx="'+dp[0].toFixed(1)+'" cy="'+dp[1].toFixed(1)+'" r="4.5" fill="'+b.dark+'"/>';
    }
    return '' +
    '<svg viewBox="0 0 200 200" aria-hidden="true">' +
      '<path d="'+outline+'" fill="'+b.main+'" stroke="'+b.dark+'" stroke-width="5" stroke-linejoin="round"/>' +
      '<circle cx="100" cy="100" r="58" fill="'+b.main+'" stroke="'+b.dark+'" stroke-width="5"/>' +
      dots +
      '<circle cx="100" cy="100" r="40" fill="'+b.light+'"/>' +
      '<circle cx="100" cy="100" r="21" fill="#ffffff" stroke="'+b.dark+'" stroke-width="4"/>' +
      '<circle cx="100" cy="100" r="8" fill="'+b.dark+'"/>' +
      '<circle cx="76" cy="72" r="9" fill="rgba(255,255,255,.55)"/>' +
    '</svg>';
  }
  /* バースト用：3つのパーツ */
  function beyPiecesHTML(b){
    var full = beySVG(b);
    return '' +
      '<div class="piece" data-p="0" style="clip-path:polygon(0 0,100% 0,50% 55%);">' + full + '</div>' +
      '<div class="piece" data-p="1" style="clip-path:polygon(0 0,50% 55%,0 100%);">' + full + '</div>' +
      '<div class="piece" data-p="2" style="clip-path:polygon(100% 0,100% 100%,0 100%,50% 55%);">' + full + '</div>';
  }

  /* ===== 音（Web Audio 合成） ===== */
  var AC = null;
  function audio(){
    if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if (AC && AC.state === "suspended") AC.resume();
    return AC;
  }
  function tone(freq, dur, type, vol, slideTo, delay){
    var ac = audio(); if(!ac) return;
    var t = ac.currentTime + (delay||0);
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type||"sine"; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.2, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t+dur+0.05);
  }
  function noise(dur, vol, freq, delay){
    var ac = audio(); if(!ac) return;
    var t = ac.currentTime + (delay||0);
    var len = Math.max(1, Math.floor(ac.sampleRate*dur));
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    var src = ac.createBufferSource(); src.buffer = buf;
    var f = ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value = freq||2000; f.Q.value = 0.8;
    var g = ac.createGain(); g.gain.value = vol||0.3;
    src.connect(f); f.connect(g); g.connect(ac.destination);
    src.start(t);
  }
  var SFX = {
    pick:   function(){ tone(660,.12,"triangle",.22); tone(990,.16,"triangle",.22,null,.08); },
    count:  function(){ tone(440,.14,"square",.16); },
    go:     function(){ tone(880,.4,"square",.2,1320); noise(.25,.12,3000); },
    shoot:  function(){ noise(.5,.28,900); tone(180,.5,"sawtooth",.1,720); },
    clash:  function(hard){
      /* アタック（立ち上がり）を強く：短いノイズを鋭く先に鳴らす。
         強い一撃ほど低く重く（低い帯域のノイズ＋重い胴鳴りを足す） */
      if (hard){
        noise(.07,.55,2400); noise(.16,.3,700);
        tone(880,.07,"square",.16,240);
        tone(196,.2,"triangle",.32,62);
      } else {
        noise(.06,.45,3200);
        tone(1320,.06,"square",.14,420);
      }
    },
    burst:  function(){ noise(.55,.5,700); tone(220,.5,"sawtooth",.22,40); tone(1200,.2,"square",.15,200,.03); },
    spinout:function(){ tone(700,.7,"sine",.18,90); },
    guts:   function(){ tone(392,.14,"triangle",.22); tone(523,.16,"triangle",.22,null,.07); tone(659,.2,"triangle",.2,null,.14); },
    dud:    function(){ tone(196,.15,"square",.12,150); },
    win:    function(){ [523,659,784,1046].forEach(function(f,i){ tone(f,.28,"triangle",.24,null,i*.13); }); noise(.4,.08,4000,.5); },
    lose:   function(){ [392,330,262].forEach(function(f,i){ tone(f,.3,"triangle",.2,null,i*.16); }); }
  };

  /* ===== 状態 ===== */
  var stadium = document.getElementById("stadium");
  var countEl = document.getElementById("count");
  var hintEl  = document.getElementById("hint");
  var shootBtn= document.getElementById("shootBtn");
  var gauges  = document.getElementById("gauges");
  var resultEl= document.getElementById("result");
  var myBey = null, cpuBey = null;
  var battleCount = 0, cpuStrong = false; // 3回に1回、相手がボスとしてさらに強くなる
  var state = "pick"; // pick | count | battle | end
  var P = []; // 物理オブジェクト
  var raf = null, lastT = 0;
  var battleT = 0; // バトル経過時間（アタックの周回半径の縮小に使う）
  /* ===== 手応え演出（数値バランスには一切触れない） =====
     ヒットストップ：衝突の強さに応じて両ベイの物理を一瞬止める
     （通常ヒット約50ms／強い一撃約110ms／バースト約200ms）。
     止まっている間も火花・リング・フラッシュは実時間で動き続ける
     （WAAPI / CSSアニメーションなので物理dtとは独立）。
     以前のスローモーション（slowmo）はヒットストップと役割が重なるため廃止し、
     強ヒットは「止まる→弾ける」のメリハリに一本化した */
  var hitstopT = 0;              // ヒットストップ残り時間（秒、実時間で減る）
  var hitShakeA = 0, hitShakeB = 0; // 見た目だけの震え量(px)：受けた側が大きく、与えた側は小さい
  var hitShakeDur = 0;           // 震えの持続（＝ヒットストップ時間）
  /* 画面振動：強い一撃のときだけ。最初が最大で収束する短い揺れ */
  var shakeT = 0, shakeDur = 0, shakeAmp = 0;
  var flashEl = document.getElementById("flash");
  /* ねばりバフ（プレイヤー専用）：押した時点の残りゲージが少ないほど強く、
     一定時間だけ自分のゲージの減りを遅くする。回復はしない。
     効くのは「自然減衰」と「ぶつかったときに受けるダメージ」の両方
     （以前は自然減衰だけだったので、衝突が主因のバトルでは体感できなかった）。
     gutsLevel 0〜1（減衰カット率 = level × 0.9、被ダメージ軽減 = level × 0.2）、
     gutsT は残り時間 */
  var gutsLevel = 0, gutsT = 0;
  var gutsBtn = document.getElementById("gutsBtn");

  /* スタジアムを空きスペースにぴったり合わせる */
  var stageWrap = document.getElementById("stageWrap");
  function fitStadium(){
    var w = stageWrap.clientWidth, h = stageWrap.clientHeight;
    if (!w || !h) return;
    var d = Math.max(180, Math.min(w, h, 780));
    stadium.style.width = d + "px";
    stadium.style.height = d + "px";
  }

  /* ===== ベイ選択 ===== */
  var choicesEl = document.getElementById("beyChoices");
  BEYS.forEach(function(b){
    var btn = document.createElement("button");
    btn.className = "choice"; btn.type = "button";
    btn.setAttribute("aria-label", b.name);
    var cat = b.tip === "flat" ? "t-atk" : (b.tip === "round" ? "t-sta" : (b.tip === "balance" ? "t-bal" : "t-def"));
    btn.innerHTML = beySVG(b) + '<span class="cname" data-len="'+b.name.length+'">'+b.name+'</span><span class="ctype '+cat+'">'+b.type+'</span>';
    btn.addEventListener("click", function(){
      audio(); SFX.pick();
      myBey = b;
      var all = choicesEl.querySelectorAll(".choice");
      for (var i=0;i<all.length;i++) all[i].classList.remove("sel");
      btn.classList.add("sel");
      shootBtn.disabled = false;
      hintEl.textContent = "したの ボタンを おしてね！";
      preview();
    });
    choicesEl.appendChild(btn);
  });

  /* ===== カード内テキストの自動フィット =====
     CSSの文字数別サイズ（data-len）だけでは端末幅によってはまだ
     はみ出すことがあるため、実測で最終保証する：表示幅に対して
     scrollWidth が超えている間、0.5pxずつ下げて必ずカード内に
     収める。短い名前はCSSサイズのまま＝必要以上に小さくならない。
     フォント読み込み完了後とリサイズ時にも再計算する */
  function fitOneText(el, minPx){
    if (!el) return;
    el.style.fontSize = "";
    var limit = el.clientWidth;
    if (!limit) return;
    var size = parseFloat(window.getComputedStyle(el).fontSize) || 14;
    var guard = 0;
    while (el.scrollWidth > limit + 1 && size > minPx && guard < 60){
      size -= 0.5;
      el.style.fontSize = size + "px";
      guard++;
    }
  }
  function fitCardTexts(){
    var cards = choicesEl.querySelectorAll(".choice");
    for (var i=0;i<cards.length;i++){
      fitOneText(cards[i].querySelector(".cname"), 9);
      fitOneText(cards[i].querySelector(".ctype"), 8);
    }
  }
  requestAnimationFrame(fitCardTexts);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCardTexts);

  function makeBeyEl(b){
    var el = document.createElement("div");
    el.className = "bey";
    el.innerHTML = beySVG(b);
    stadium.appendChild(el);
    return el;
  }
  var previewEl = null;
  /* 選択画面ではステージを表示しないので、プレビューは置かない。
     選択状態はカードのハイライト（.sel）で十分に分かる */
  function preview(){
    clearStage();
  }
  function clearStage(){
    var els = stadium.querySelectorAll(".bey,.spark,.ringFx,.hitCore");
    for (var i=0;i<els.length;i++) els[i].remove();
    P = []; previewEl = null;
  }

  /* ===== バトル開始 ===== */
  shootBtn.addEventListener("click", function(){
    if (!myBey || state==="count" || state==="battle") return;
    audio();
    battleCount++;
    cpuStrong = (battleCount % 3 === 0);
    var pool = BEYS.filter(function(b){ return b.id !== myBey.id; });
    var base = pool[Math.floor(Math.random()*pool.length)];
    /* 通常戦の相手は基礎倍率 1.25（プレイヤーに「ねばる」ボタンがある分、
       以前の1.15から少し引き上げ）。それ以外の仕組み
       （ダメージ・弾かれ方・バースト条件・減衰など）は両者完全に対称 */
    cpuBey = Object.assign({}, base, { cpuMult: 1.25 });
    if (cpuStrong){
      /* 3回に1回は格上のボス戦：基礎倍率1.25にボス追加分（約1.18倍）を
         掛けて、合計で約1.48倍 */
      cpuBey = Object.assign({}, cpuBey, { cpuMult: cpuBey.cpuMult * 1.18 });
    }
    startCountdown();
  });

  /* ===== ねばりボタン（プレイヤーだけ） =====
     押すたびに、その時点の残りゲージ割合で強さが決まるバフが付く：
       残り85%以上 … ほぼ効果なし（strength 0）
       残り30%以下 … 最大（strength 1）
     連続押しで level が重なるが上限1で頭打ち（減衰カット最大90%、
     被ダメージ軽減最大20%）。持続は約4.5秒で、押すたびに残り時間が戻る。
     ゲージ自体は回復しない */
  var gYouEl = document.getElementById("gYou");
  gutsBtn.addEventListener("click", function(){
    if (state !== "battle" || !P.length) return;
    audio();
    var me = P[0];
    var ratio = me.spin / me.max;
    var strength = Math.max(0, Math.min(1, (0.85 - ratio) / 0.55));
    gutsBtn.classList.remove("pop","dud"); void gutsBtn.offsetWidth;
    if (strength < 0.05){
      /* ゲージがまだ多いときは ほぼ効かない：小さな反応だけ返す */
      SFX.dud();
      gutsBtn.classList.add("dud");
      return;
    }
    gutsLevel = Math.min(1, gutsLevel + strength);
    gutsT = 4.5;
    SFX.guts();
    if (navigator.vibrate) navigator.vibrate(20);
    gutsBtn.classList.add("pop","on");
    gutsBtn.textContent = "ねばってる！";
    gYouEl.classList.add("gutsOn");
    me.el.classList.add("guts");
    sparks(me.x, me.y, 6);
  });
  /* ねばりが切れたときの見た目を全部戻す */
  function gutsOff(){
    gutsBtn.classList.remove("on");
    gutsBtn.textContent = "ねばる！";
    gYouEl.classList.remove("gutsOn");
    if (P.length) P[0].el.classList.remove("guts");
  }

  function startCountdown(){
    state = "count";
    hitstopT = 0; shakeT = 0; hitShakeA = 0; hitShakeB = 0;
    stadium.style.transform = "";
    battleT = 0;
    gutsLevel = 0; gutsT = 0;
    gutsBtn.style.display = "none";
    gutsOff();
    shootBtn.style.display = "none";
    resultEl.style.display = "none";
    document.getElementById("pick").style.display = "none";
    stageWrap.style.display = "flex";
    hintEl.textContent = "";
    clearStage();
    gauges.style.display = "flex";
    fitStadium();

    var r = stadium.clientWidth, size = r*0.162;
    /* プレイヤーはゲージ100。CPUは基礎倍率ぶんだけ上限が大きい */
    P = [
      { b:myBey,  el:makeBeyEl(myBey),  x:r*0.30, y:r*0.62, vx:0, vy:0, ang:0, spin:0, max:100,               me:true,  dir:1,  clashCd:0, kickT:0, recoverT:1.8, orbitCum:0, orbitAng:null, shrinkStart:null, baseUx:null, baseUy:null, baseTx:null, baseTy:null },
      { b:cpuBey, el:makeBeyEl(cpuBey), x:r*0.70, y:r*0.38, vx:0, vy:0, ang:0, spin:0, max:100*cpuBey.cpuMult, me:false, dir:-1, clashCd:0, kickT:0, recoverT:1.8, orbitCum:0, orbitAng:null, shrinkStart:null, baseUx:null, baseUy:null, baseTx:null, baseTy:null }
    ];
    P.forEach(function(p){
      p.el.style.transform = "translate("+(p.x-size/2)+"px,"+(p.y-size/2)+"px)";
    });
    /* 金色の光と王冠はボス戦だけ。通常戦の相手は通常表示 */
    if (cpuStrong) P[1].el.classList.add("strong");
    var whoCpu = document.querySelector("#gCpu .who");
    whoCpu.textContent = cpuStrong ? "ボス あいて" : "あいて";
    whoCpu.classList.toggle("boss", cpuStrong);
    updateGauges();

    countEl.style.display = "flex";
    var steps = ["3","2","1","ゴー！<br>シュート！"];
    var i = 0;
    (function next(){
      if (i < steps.length){

  function launch(){
    state = "battle";
    gutsBtn.style.display = "block";
    var r = stadium.clientWidth;
    P.forEach(function(p){
      p.spin = p.max;
      /* 最初から自分のタイプの周回軌道に乗せる：中心から目標半径の位置に置き、
         接線方向の初速を与える */
      var cx = r/2, cy = r/2, maxD = r/2 - (r*0.162)/2 - r*0.035;
      var R = orbitRadius(p, maxD);
      var a = p.me ? Math.PI*0.75 : Math.PI*1.75;
      p.x = cx + Math.cos(a)*R; p.y = cy + Math.sin(a)*R;
      var sp = r * 1.04;
      p.vx = -Math.sin(a)*sp*p.dir; p.vy = Math.cos(a)*sp*p.dir;
      /* 周回カウントをリセット：中心まわりの累積角度と縮小開始時刻 */
      p.orbitCum = 0;
      p.orbitAng = Math.atan2(p.y - cy, p.x - cx);
      p.shrinkStart = null;
      /* 中心付近で使う保持基底を初期位置で初期化する */
      p.baseUx = Math.cos(a); p.baseUy = Math.sin(a);
      p.baseTx = -p.baseUy * p.dir; p.baseTy = p.baseUx * p.dir;
    });
    hintEl.textContent = cpuStrong ? "ボスだ！ ゲージが へったら「ねばる！」" : "ゲージが へったら「ねばる！」を おしてね";

  }

  /* ===== 動き：タイプ別の周回半径 =====
     アタック（flat）  : 最初の約2周はスタジアムの約85%の大きな円のまま。
                         中心まわりの累積角度が2周分（720°）を超えたら
                         縮小を始め、そこから約5秒で約23%まで寄って
                         中心の相手に届く（開始判定は時間ではなく周回数）。
                         縮み切ったあとも目標半径は約23%のままなので、
                         弾かれて外へ出ても再び中心へ戻ってくる
     スタミナ（round） : 約25%の中心寄りの円（基本は真ん中寄りだが、
                         以前の約13%より少し広く回る）
     防御（sharp）     : 約45%の中くらいの円で穏やかに周回
     バランス（balance）: 約55%の中くらいの円。終盤（12秒〜24秒）で
                         約35%までだけ、ゆるやかに縮む（アタックの
                         ような急な中心寄せはしない） */
  function orbitRadius(p, maxD){
    if (p.b.tip === "flat"){
      if (p.shrinkStart === null || p.shrinkStart === undefined) return maxD * 0.85;
      var s = Math.min(1, (battleT - p.shrinkStart) / 5);
      return maxD * (0.85 - 0.62 * s);
    }
    if (p.b.tip === "round") return maxD * 0.25;
    if (p.b.tip === "balance"){
      var bs = Math.min(1, Math.max(0, (battleT - 12) / 12));
      var bsm = bs * bs * (3 - 2 * bs); /* smoothstepでゆるやかに */
      return maxD * (0.55 - 0.20 * bsm);
    }
    return maxD * 0.45;
  }
  /* 周回スピード（接線方向、px/秒）。アタックは速く、防御は穏やか、
     バランスはその中間。全タイプとも従来比で約1.45倍→さらに約1.3倍の速さ */
  function orbitSpeed(p, r, speedRatio){
    var base = p.b.tip === "flat" ? 1.79 : (p.b.tip === "round" ? 0.85 : (p.b.tip === "balance" ? 1.32 : 1.13));
    return r * base * (p.b.speedMul || 1) * (0.35 + 0.65 * speedRatio);
  }
  /* ===== 速度の天井（ラチェット防止） =====
     速度の大きさの上限は、その時点の目標軌道速度（orbitSpeed）と
     残りspinから決める。吹っ飛びで軌道速度を超えるのは許すが、
     天井は軌道速度の1.75倍＋少しだけ。spinが減れば天井も下がるので、
     終盤に速さだけが積み上がることはない */
  function speedCap(p, r, speedRatio){
    return orbitSpeed(p, r, speedRatio) * 1.75 + r * 0.25;
  }
  /* 逓減係数：現在速度が天井に近いほど、kick／swirl の実効加算を
     小さくする。天井から遠いときは約1（従来の体感そのまま）、
     天井付近では約0.15まで落ちる */
  function diminishFactor(preSpeed, cap){
    if (!(cap > 0)) return 0.15;
    var ratio = preSpeed / cap;
    if (ratio < 0) ratio = 0; else if (ratio > 1) ratio = 1;
    return 1 - 0.85 * ratio * ratio;
  }
  /* 付け替えクランプ：衝突後の速度の大きさを
     「天井」と「衝突前速度＋1回分のkick相当」の小さい方以下に収める。
     加算ではなく上限付きの付け替えにすることで、ぶつかるたびに
     速度が際限なく積み上がるラチェットを断つ */
  function clampToBudget(p, preSpeed, kickNom, cap){
    var v = Math.hypot(p.vx, p.vy);
    if (!(v > 0)) return;
    var allowed = Math.min(cap, preSpeed + Math.max(0, kickNom));
    if (v > allowed){
      p.vx *= allowed / v; p.vy *= allowed / v;
    }
  }

  /* ===== 物理ループ ===== */
  function tick(now){
    if (state !== "battle") return;
    var rawDt = Math.min(0.033, (now-lastT)/1000); lastT = now;
    /* ヒットストップ中は物理dtを0にして両ベイを止める。
       火花・リングは実時間アニメーションなので止まらず動き続ける。
       画面振動も実時間で進み、止まっている間も揺れてから収束する */
    var dt = rawDt;
    if (hitstopT > 0){ hitstopT -= rawDt; dt = 0; }
    if (shakeT > 0){
      shakeT -= rawDt;
      if (shakeT <= 0){ shakeT = 0; stadium.style.transform = ""; }
      else {
        var sk = shakeAmp * (shakeT / shakeDur) * (shakeT / shakeDur);
        var sx = (Math.random()*2-1) * sk, sy = (Math.random()*2-1) * sk;
        stadium.style.transform = "translate("+sx.toFixed(1)+"px,"+sy.toFixed(1)+"px)";
      }
    }
    battleT += rawDt; /* 周回半径の縮小タイマーは従来通り実時間で進める（バランス不変） */
    /* ねばりバフの残り時間（実時間で切れる。切れたら光も消える） */
    if (gutsT > 0){
      gutsT -= rawDt;
      if (gutsT <= 0){
        gutsT = 0; gutsLevel = 0;
        gutsOff();
      }
    }
    var r = stadium.clientWidth, size = r*0.162, rad = size/2;
    var cx = r/2, cy = r/2, maxD = r/2 - rad - r*0.035;

    P.forEach(function(p){
      /* ゲージの自然な減り：タイプ特性 decay が基本（両者同じ計算）。
         アタックは速く（約20秒で満タン→0）、防御は普通（約38秒）、
         スタミナは遅い（約55秒）。CPUの上限は倍率ぶんだけ変わる
         （通常戦は1.25倍ぶん少し大きく、ボス戦はさらに大きい） */
      /* 根性補正（両ベイ共通の基本仕様）：残りゲージが少ないほど
         自然減衰が遅くなる。倍率 = 0.35 + 0.65×残り割合 で、満タン時は
         従来通り（×1.0）、残りわずかでは減衰が約1/3（×0.35）まで落ちる。
         タイプ間の減衰比率はそのまま維持される */
      /* ねばりバフ中はプレイヤーの自然減衰がさらに最大90%カットされる。
         衝突ダメージの軽減は衝突処理側で適用。CPUにはバフなし */
      var dec = dt * p.b.decay * (0.35 + 0.65 * (p.spin / p.max));
      if (p.me && gutsT > 0) dec *= (1 - 0.9 * gutsLevel);
      p.spin -= dec;
      if (p.spin < 0) p.spin = 0;
      if (p.clashCd > 0) p.clashCd -= dt;
      if (p.kickT > 0){ p.kickT -= dt; p.recoverT = 0; }
      var speedRatio = p.spin / p.max;

      var dx = p.x-cx, dy = p.y-cy, d = Math.hypot(dx,dy)||1;
      var ux = dx/d, uy = dy/d;            /* 中心から外向き */
      var tx = -uy*p.dir, ty = ux*p.dir;   /* 周回方向（接線） */
      /* 中心付近の基底保持：中心を横切るように弾かれると、位置から
         計算した接線／外向きの向きが約180°ひっくり返り、目標速度
         自体が反転して「唐突に逆向きへ動き出す」原因になる。
         中心からベイ半径ほど（r*0.09）以内にいる間は前フレームの
         基底を使い続け、外に出たときだけ今の位置で基底を更新する */
      if (d < r * 0.09 && p.baseUx !== null && p.baseUx !== undefined){
        ux = p.baseUx; uy = p.baseUy; tx = p.baseTx; ty = p.baseTy;
      } else {
        p.baseUx = ux; p.baseUy = uy; p.baseTx = tx; p.baseTy = ty;
      }

      /* アタックの半径縮小の開始判定：中心まわりの累積角度を数える。
         位置の角度の差分（−π〜πに正規化）の絶対値を積み上げ、2周分
         （720°＝4π rad）を超えた瞬間の時刻を shrinkStart に記録する。
         弾かれている間も位置ベースで数えるので、外へ飛ばされても
         周回として正しく進む */
      if (p.b.tip === "flat"){
        var angNow = Math.atan2(dy, dx);
        if (p.orbitAng !== null && p.orbitAng !== undefined){
          var da = angNow - p.orbitAng;
          while (da > Math.PI) da -= Math.PI*2;
          while (da < -Math.PI) da += Math.PI*2;
          p.orbitCum += Math.abs(da);
          if (p.shrinkStart === null && p.orbitCum >= Math.PI*4) p.shrinkStart = battleT;
        }
        p.orbitAng = angNow;
      }

      if (p.kickT > 0){
        /* 弾かれた直後は勢いのまま飛ぶ：操舵せず軽い減衰だけ。
           ただし速度の大きさが天井を超えている分は、方向には触れず
           大きさだけ常時削る（復帰ランプとは無関係に効く） */
        p.vx *= (1 - 0.5*dt); p.vy *= (1 - 0.5*dt);
        var capK = speedCap(p, r, speedRatio);
        var vK = Math.hypot(p.vx, p.vy);
        if (vK > capK && vK > 0){
          var newVK = capK + (vK - capK) * Math.max(0, 1 - dt*5);
          p.vx *= newVK / vK; p.vy *= newVK / vK;
        }
      } else {
        /* 目標速度＝接線方向の周回＋目標半径へ寄せるバネ、へ滑らかに寄せる */
        var targetR = orbitRadius(p, maxD);
        /* 引き戻しの強さは全タイプ・全フェーズで通常並みに統一する。
           以前は縮小開始後のアタックだけ pullGain 9／上限 r*1.1 の
           特例があり、ランプが戻り切った瞬間に弾かれた向きと逆へ
           フルパワーで引いて「止まって逆発射」になっていた。
           特例は廃止：ゲイン3.5／上限 r*0.72 のみ */
        var pullGain = 3.5, pullCap = r * 0.72;
        /* 復帰ランプ：弾かれた直後（kickT終了直後）は約1.8秒かけて
           効きを戻すが、線形ではなく smoothstep（最初はほぼ効かず、
           中盤から徐々に効くイーズイン）にし、半径成分だけでなく
           接線成分を含む目標速度全体への寄せに適用する */
        p.recoverT = Math.min(1.8, (p.recoverT || 0) + dt);
        var ramp01 = p.recoverT / 1.8;
        var ramp = ramp01 * ramp01 * (3 - 2 * ramp01);
        var radialV = (targetR - d) * pullGain;
        var cap = pullCap;
        if (radialV > cap) radialV = cap; else if (radialV < -cap) radialV = -cap;
        var os = orbitSpeed(p, r, speedRatio);
        var desVx = tx*os + ux*radialV;
        var desVy = ty*os + uy*radialV;
        /* ===== 操舵：力そのものを弱くし、向きは連続的に回す =====
           ・接近レートは dt*0.9（時定数 約1.1秒）。以前の dt*4.6
             （時定数 約0.22秒）のような急な寄せはしない
           ・今の速度と目標の向きが大きくずれている（90°超）ときは
             ベクトルの線形補間をやめ、向きを回転させて寄せる。
             線形補間だと速度がゼロを突っ切って逆向きに発射されるが、
             回転なら大きさを保ったまま U ターンになる
           ・回転速度にも上限（約10 rad/秒 × ランプ連動）を付け、
             向きの変化は常に連続になる */
        var oldVx = p.vx, oldVy = p.vy;
        var curMag = Math.hypot(oldVx, oldVy);
        var desMag = Math.hypot(desVx, desVy);
        if (curMag > 1 && desMag > 1 &&
            (oldVx*desVx + oldVy*desVy) < 0){
          /* 向きが90°超ずれている：回転で寄せる */
          var angCur = Math.atan2(oldVy, oldVx);
          var angDes = Math.atan2(desVy, desVx);
          var gapA = angDes - angCur;
          while (gapA > Math.PI) gapA -= Math.PI*2;
          while (gapA < -Math.PI) gapA += Math.PI*2;
          var maxTurn = 10 * dt * (0.3 + 0.7 * ramp);
          var turnA = gapA;
          if (turnA > maxTurn) turnA = maxTurn; else if (turnA < -maxTurn) turnA = -maxTurn;
          var magRate = Math.min(1, dt*0.9) * ramp;
          var rotMag = curMag + (desMag - curMag) * magRate;
          var angNew = angCur + turnA;
          p.vx = Math.cos(angNew) * rotMag;
          p.vy = Math.sin(angNew) * rotMag;
        } else {
          var steer = Math.min(1, dt*0.9) * ramp;
          p.vx += (desVx - p.vx) * steer;
          p.vy += (desVy - p.vy) * steer;
        }
        /* 加速度リミット：このフレームの速度変化量そのものに上限を
           付け、どの経路でも向き・大きさが1フレームで跳ばない
           ことを保証する（衝突・壁の跳ね返しは対象外で従来通り） */
        var dvx = p.vx - oldVx, dvy = p.vy - oldVy;
        var dvL = Math.hypot(dvx, dvy);
        var maxDv = r * 15 * dt;
        if (dvL > maxDv && dvL > 0){
          p.vx = oldVx + dvx * (maxDv / dvL);
          p.vy = oldVy + dvy * (maxDv / dvL);
        }
        /* 速度の「大きさ」の寄せも復帰中はランプに連動させる：
           以前は dt*3.2 でランプと無関係に常時効かせていたため、
           復帰の動きがちぐはぐになっていた。ランプ全開（通常時）は
           従来通り dt*3.2。なお速度天井（speedCap／この後の軟らかい
           クランプと衝突側の clampToBudget）のハード上限は維持し、
           加速ラチェットは再発させない */
        var vNow = Math.hypot(p.vx, p.vy);
        if (vNow > desMag && vNow > 0){
          var magPull = Math.min(1, dt*3.2 * ramp);
          var newMag = vNow + (desMag - vNow) * magPull;
          p.vx *= newMag / vNow; p.vy *= newMag / vNow;
        }
      }
      /* 速度の上限：固定値ではなく、その時点の目標軌道速度と
         残りspinから決まる天井（speedCap）を使う。
         kickT終了時も即時クランプせず、軟らかい処理で
         超過分を漸近的に削る（復帰の瞬間に速度がガクッと切れない） */
      var v = Math.hypot(p.vx,p.vy);
      var vmax = speedCap(p, r, speedRatio);
      if (v > vmax){
        var softCap = vmax + (v - vmax) * Math.max(0, 1 - dt*3);
        p.vx *= softCap/v; p.vy *= softCap/v;
      }
      p.x += p.vx*dt; p.y += p.vy*dt;
      /* 壁：スタジアムの縁でバチンと弾かれる（両者同じ） */
      var dd = Math.hypot(p.x-cx, p.y-cy);
      if (dd > maxD){
        var nx = (p.x-cx)/dd, ny = (p.y-cy)/dd;
        p.x = cx + nx*maxD; p.y = cy + ny*maxD;
        var dot = p.vx*nx + p.vy*ny;
        if (dot > 0){
          p.vx -= 1.9*dot*nx; p.vy -= 1.9*dot*ny;
          p.vx *= 0.94; p.vy *= 0.94;
          if (dot > r*0.4){ sparks(p.x, p.y, 6); SFX.clash(false); p.spin -= 1.2; }
        }

      /* ヒットストップ中の震えは見た目だけ：判定位置(p.x/p.y)は動かさず、
         transformに小さなランダムオフセットを足すだけ。
         受けた側(hitShake大)が大きく、与えた側は小さく震える */
      var jx = 0, jy = 0;
      if (hitstopT > 0 && hitShakeDur > 0){
        var amp = (p === P[0] ? hitShakeA : hitShakeB) * Math.max(0, hitstopT / hitShakeDur);
        if (amp > 0.2){ jx = (Math.random()*2-1) * amp; jy = (Math.random()*2-1) * amp; }
      }
      p.el.style.transform = "translate("+(p.x-rad+jx)+"px,"+(p.y-rad+jy)+"px) rotate("+p.ang+"deg)";
      /* ねばり中はフラフラ（wobble）も止まる＝粘って回り続けているのが見える */
      p.el.classList.toggle("wobble", speedRatio < 0.3 && p.spin > 0 && !(p.me && gutsT > 0));
    });

    /* 衝突：本物みたいに両方が反対方向へ弾かれる */
    if (P.length===2){
      var a=P[0], b=P[1];
      var dx=b.x-a.x, dy=b.y-a.y, dist=Math.hypot(dx,dy);
      var hitDist = size*0.92;
      if (dist < hitDist && dist > 0.01){
        var nx=dx/dist, ny=dy/dist;
        /* めり込みを両方で半分ずつ押し戻す */
        var overlap = hitDist - dist;
        a.x -= nx*overlap/2; a.y -= ny*overlap/2;
        b.x += nx*overlap/2; b.y += ny*overlap/2;
        /* 法線方向の接近速度（正なら向かい合って近づいている） */
        var van = a.vx*nx + a.vy*ny, vbn = b.vx*nx + b.vy*ny;
        var approach = van - vbn;
        if (approach > 0 && a.clashCd <= 0 && b.clashCd <= 0){
          var hard = approach > r*0.32;
          /* ===== 速度予算：衝突は「無予算の加算」ではなく
             「上限付きの付け替え」にする =====
             衝突前の速度の大きさと、その時点の天井（目標軌道速度と
             残りspinから決まる speedCap）を先に控える。
             kick／swirl には天井に近いほど小さくなる逓減係数を掛け、
             適用後も各ベイの速さが「衝突前＋1回分のkick相当」と
             天井の小さい方を超えないよう付け替える（下でクランプ）。
             これで激しさ（はじき・吹っ飛び）は残したまま、
             ぶつかるたびに速さが積み上がるラチェットを断つ */
          var spinRa = a.spin/a.max, spinRb = b.spin/b.max;
          var avgSpin = (spinRa + spinRb) / 2;
          var preSpeedA = Math.hypot(a.vx, a.vy);
          var preSpeedB = Math.hypot(b.vx, b.vy);
          var capA = speedCap(a, r, spinRa);
          var capB = speedCap(b, r, spinRb);
          var dimA = diminishFactor(preSpeedA, capA);
          var dimB = diminishFactor(preSpeedB, capB);
          /* 弾性衝突：法線成分を入れ替えるように両方を跳ね返す（反発係数つき） */
          var rest = hard ? 0.96 : 0.88;
          var impulse = (1 + rest) * approach / 2;
          a.vx -= impulse*nx; a.vy -= impulse*ny;
          b.vx += impulse*nx; b.vy += impulse*ny;
          /* ノックバック：名目は従来比で約1.35倍のまま（体感維持）。
             非対称も維持する：回転がより残っている側（強く当たった側）が
             相手をより遠くへ弾き、自分はあまり飛ばない。
             ただし approach 比例項はそのまま使うと、速くなるほど
             次の approach が増えて kick が増える自己増幅になるため、
             approach は r*0.85 で頭打ちにした値を使う。
             さらに実効 kick には逓減係数（dim）を掛ける */
          var approachCapped = Math.min(approach, r * 0.85);
          var kick = (r * (0.16 + 0.30*avgSpin) + approachCapped * 0.28) * 1.35;
          var edge = spinRa - spinRb; /* -1〜1：正なら a の方が回転が残っている */
          var kickNomA = kick * (1 - 0.45*edge);
          var kickNomB = kick * (1 + 0.45*edge);
          var kickA = kickNomA * dimA;
          var kickB = kickNomB * dimB;
          a.vx -= nx*kickA; a.vy -= ny*kickA;
          b.vx += nx*kickB; b.vy += ny*kickB;
          /* 横方向のキック：当たったあとカーブして離れる、本物のベイらしい動き。
             符号はランダムではなく各ベイ自身の周回方向（dir）に合わせる：
             自分の回る向きと喧嘩しないので、弾かれたあと逆向きに動いてから
             無理に回り始める二段モーションにならない。名目の大きさは
             従来通りだが、実効値には kick と同じ逓減係数を掛ける */
          var swMag = (Math.random()*0.7 + 0.5) * r * 0.22;
          var adx = a.x-cx, ady = a.y-cy, ad = Math.hypot(adx,ady)||1;
          var bdx = b.x-cx, bdy = b.y-cy, bd = Math.hypot(bdx,bdy)||1;
          a.vx += (-ady/ad)*a.dir*swMag*dimA; a.vy += (adx/ad)*a.dir*swMag*dimA;
          b.vx += (-bdy/bd)*b.dir*swMag*dimB; b.vy += (bdx/bd)*b.dir*swMag*dimB;
          /* 付け替えクランプ：弾性交換＋kick＋swirl を全部入れた後で、
             各ベイの速さを「天井」と「衝突前＋名目kick1回分」の
             小さい方以下に収める。1回の衝突で増える速さは
             最大でも kick 1回分までになり、際限なくは上がらない */
          clampToBudget(a, preSpeedA, kickNomA, capA);
          clampToBudget(b, preSpeedB, kickNomB, capB);
          /* 弾かれた直後は二人とも一瞬ゆっくりに見せてから勢いよく離れる */
          a.clashCd = 0.18; b.clashCd = 0.18;
          a.kickT = 0.25; b.kickT = 0.25;
          /* ヒットストップはダメージ確定後に下で設定する（受けた側の判定に使うため） */
          /* ダメージ：与える側の atk × 受ける側の guard で決まる（両者共通の式）。
             攻撃タイプは atk 1.3 で大きく削るが guard は普通（1.0）。
             スタミナは atk 0.7 で削りは小さいが guard 1.3 で削られやすい。
             防御は atk 0.9 で削りはほどほど、guard 0.6 で硬い。
             CPUの基礎倍率は与ダメージにも同じだけ乗る */
          var multA = b.me ? 1 : b.b.cpuMult; /* b→a への倍率 */
          var multB = a.me ? 1 : a.b.cpuMult; /* a→b への倍率 */
          var dmgA = (3.5 + Math.random()*4.5) * b.b.atk * (hard?1.5:1.1) * a.b.guard * multA;
          var dmgB = (3.5 + Math.random()*4.5) * a.b.atk * (hard?1.5:1.1) * b.b.guard * multB;
          /* ねばり中はプレイヤーの受けるダメージも軽減される（最大20%）。
             ゲージ減少の主因は衝突なので、ここに効かせないと体感できない。
             軽減率は以前60%だったが、ペンギン対ゴーレムで「ねばる」を
             使うと約9割勝ててしまい圧勝すぎたため20%まで下げた
             （シミュレーション検証：同対戦のねばる勝率 約74%、
             ねばる無しは約3割・接戦のまま不変） */
          if (gutsT > 0){
            if (a.me) dmgA *= (1 - 0.2 * gutsLevel);
            if (b.me) dmgB *= (1 - 0.2 * gutsLevel);
          }
          a.spin -= dmgA; b.spin -= dmgB;
          /* ===== 手応え：ヒットストップ＋震え＋ヒットマーク＋画面振動 =====
             止まる長さは衝撃の強さで変える（通常 約50ms／強い一撃 約110ms）。
             受けた側（受けたダメージが大きい側）を大きく震わせる */
          hitstopT = hard ? 0.11 : 0.05;
          hitShakeDur = hitstopT;
          if (dmgA >= dmgB){ hitShakeA = hard?5.5:3.5; hitShakeB = hard?2:1.2; }
          else             { hitShakeB = hard?5.5:3.5; hitShakeA = hard?2:1.2; }
          /* 画面振動は強い一撃だけ：約0.18秒、最大約5px、最初強く→収束 */
          if (hard){ shakeDur = 0.18; shakeT = shakeDur; shakeAmp = Math.min(6, r*0.018); }
          var hitX = (a.x+b.x)/2, hitY = (a.y+b.y)/2;
          sparks(hitX, hitY, hard?16:9, hard);
          ringFx(hitX, hitY, hard);
          hitCore(hitX, hitY, hard);
          SFX.clash(hard);
          if (navigator.vibrate) navigator.vibrate(hard?60:25);
          /* バースト：強い一撃のときだけ、残りゲージが少ない相手が
             ごくまれに弾け飛ぶ（目安は3試合に1回起きるかどうか）。
             攻撃タイプの強い一撃を受けたときは少しだけ起きやすい
             （両者同じルール）。通常ヒットではバーストしない */
          if (hard){
            var burstThreshA = (b.b.tip === "flat") ? 0.30 : 0.22;
            var burstProbA   = (b.b.tip === "flat") ? 0.04 : 0.03;
            var burstThreshB = (a.b.tip === "flat") ? 0.30 : 0.22;
            var burstProbB   = (a.b.tip === "flat") ? 0.04 : 0.03;
            if (a.spin < a.max*burstThreshA && Math.random()<burstProbA) return finish(a, true);
            if (b.spin < b.max*burstThreshB && Math.random()<burstProbB) return finish(b, true);
          }
        } else if (approach > 0){
          /* クールダウン中はすり抜けず、軽く押し合いだけ続ける。
             ここも無予算で足し続けると積み上がるので、適用後は
             各ベイの速さを天井以下に収める */
          var soft = approach * 0.5;
          a.vx -= nx*soft; a.vy -= ny*soft;
          b.vx += nx*soft; b.vy += ny*soft;
          var capSa = speedCap(a, r, a.spin/a.max);
          var capSb = speedCap(b, r, b.spin/b.max);
          var vSa = Math.hypot(a.vx, a.vy), vSb = Math.hypot(b.vx, b.vy);
          if (vSa > capSa && vSa > 0){ a.vx *= capSa/vSa; a.vy *= capSa/vSa; }
          if (vSb > capSb && vSb > 0){ b.vx *= capSb/vSb; b.vy *= capSb/vSb; }
        }
      }
    }
    updateGauges();

    var loser = null;
    P.forEach(function(p){ if (p.spin <= 0.5) loser = p; });
    if (loser) return finish(loser, false);

    raf = requestAnimationFrame(tick);
  }

  function sparks(x,y,n,hard){
    for (var i=0;i<n;i++){
      var s = document.createElement("div");
      s.className = "spark" + (hard && i%3===0 ? " big" : "");
      s.style.left = x+"px"; s.style.top = y+"px";
      stadium.appendChild(s);
      var a = Math.random()*Math.PI*2, d = 26+Math.random()*(hard?78:54);
      s.animate([
        { transform:"translate(0,0) scale(1)", opacity:1 },
        { transform:"translate("+(Math.cos(a)*d)+"px,"+(Math.sin(a)*d)+"px) scale(.2)", opacity:0 }
      ], { duration:260+Math.random()*220, easing:"ease-out" });
      setTimeout((function(el){ return function(){ el.remove(); }; })(s), 520);
    }
  }
  function ringFx(x,y,hard){
    var s = document.createElement("div");
    s.className = "ringFx" + (hard ? " hard" : ""); s.style.left = x+"px"; s.style.top = y+"px";
    stadium.appendChild(s);
    setTimeout(function(){ s.remove(); }, hard ? 460 : 340);
  }
  /* 当たった位置の白い芯（ヒットマークの中心） */
  function hitCore(x,y,hard){
    var s = document.createElement("div");
    s.className = "hitCore" + (hard ? " hard" : ""); s.style.left = x+"px"; s.style.top = y+"px";
    stadium.appendChild(s);
    setTimeout(function(){ s.remove(); }, hard ? 260 : 200);
  }
  /* バースト時のフラッシュ：一瞬だけ画面を白く光らせる */
  function burstFlash(){
    if (!flashEl) return;
    flashEl.animate([
      { opacity:0.9 }, { opacity:0 }
    ], { duration:260, easing:"ease-out" });
  }

  /* ===== ゲージ ===== */
  var fillYou = document.querySelector("#gYou .fill");
  var fillCpu = document.querySelector("#gCpu .fill");
  function updateGauges(){
    if (!P.length) return;
    fillYou.style.width = Math.max(0, P[0].spin/P[0].max*100) + "%";
    fillCpu.style.width = Math.max(0, P[1].spin/P[1].max*100) + "%";
  }

  /* ===== 終了 ===== */
  function finish(loser, burst){
    state = "end";
    gutsBtn.style.display = "none";
    gutsLevel = 0; gutsT = 0;
    gutsOff();
    if (raf) cancelAnimationFrame(raf);
    var winner = (loser === P[0]) ? P[1] : P[0];
    var iWin = winner.me;

    if (burst){
      SFX.burst();
      if (navigator.vibrate) navigator.vibrate([80,40,120]);
      /* バーストは最長のヒットストップ（約200ms）＋フラッシュ：
         一瞬止まって激しく震えてから、パーツが弾け飛ぶ */
      burstFlash();
      /* 終了後はtickが止まるので、画面振動はWAAPIで直接かける（短く収束） */
      if (stadium.animate){
        stadium.animate([
          { transform:"translate(0px,0px)" },
          { transform:"translate(5px,-4px)" },
          { transform:"translate(-4px,3px)" },
          { transform:"translate(2px,-1px)" },
          { transform:"translate(0px,0px)" }
        ], { duration:220, easing:"ease-out" });
      }
      var br = stadium.clientWidth, brad = br*0.162/2;
      var baseTr = "translate("+(loser.x-brad)+"px,"+(loser.y-brad)+"px) rotate("+loser.ang+"deg)";
      var bStart = performance.now();
      (function bShake(now){
        var bt = (now-bStart)/1000;
        if (bt >= 0.2 || state !== "end"){ loser.el.style.transform = baseTr; return; }
        var ba = 6 * (1 - bt/0.2);
        loser.el.style.transform = "translate("+(loser.x-brad+(Math.random()*2-1)*ba)+"px,"+(loser.y-brad+(Math.random()*2-1)*ba)+"px) rotate("+loser.ang+"deg)";
        requestAnimationFrame(bShake);
      })(bStart);
      setTimeout(function(){
        if (state !== "end") return;
        loser.el.innerHTML = beyPiecesHTML(loser.b);
        var dirs = [[-1,-1],[ -1.4,0.4],[1,1]];
        var pieces = loser.el.querySelectorAll(".piece");
        pieces.forEach(function(pc, i){
          pc.style.transform = "translate("+(dirs[i][0]*70)+"px,"+(dirs[i][1]*70)+"px) rotate("+(i*70-60)+"deg)";
          pc.style.opacity = "0.25";
        });
        sparks(loser.x, loser.y, 22, true);
      }, 200);
    } else {
      SFX.spinout();
      loser.el.classList.add("wobble");
    }
    /* 勝者は回り続ける */
    var start = performance.now();
    (function celeb(now){
      if (state !== "end") return;
      var t = (now-start)/1000;
      winner.ang += 0.36;
      var r = stadium.clientWidth, rad = r*0.162/2;
      winner.el.style.transform = "translate("+(winner.x-rad)+"px,"+(winner.y-rad)+"px) rotate("+winner.ang+"deg) scale("+(1+Math.sin(t*6)*0.05)+")";
      if (t < 1.6) requestAnimationFrame(celeb);
    })(start);

    setTimeout(function(){
      var rb = document.getElementById("resBig");
      rb.textContent = iWin ? "かった！！" : "まけた…";
      rb.classList.toggle("win", iWin);
      document.getElementById("resSub").classList.toggle("burst", !!burst);
      document.getElementById("resSub").textContent =
        burst ? (iWin ? "あいてが バラバラに なった！" : "バラバラに なっちゃった…")
              : (iWin ? "あいてが とまった！" : "とまっちゃった…");
      resultEl.style.display = "flex";
      if (iWin){ SFX.win(); confetti(); } else { SFX.lose(); }
    }, burst ? 900 : 1100);
  }

  function confetti(){
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var colors = ["#ef4444","#3b82f6","#22c55e","#eab308","#9ca3af","#7dd3fc","#a855f7","#b45309","#facc15"];
    for (var i=0;i<70;i++){
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = (Math.random()*100)+"vw";
      c.style.background = colors[i%colors.length];
      var sz = 8+Math.random()*10;
      c.style.width = sz+"px"; c.style.height = sz*0.6+"px";
      c.style.animationDuration = (1.6+Math.random()*1.6)+"s";
      c.style.animationDelay = (Math.random()*0.5)+"s";
      document.body.appendChild(c);
      setTimeout((function(el){ return function(){ el.remove(); }; })(c), 4200);
    }
  }

  /* ===== リセット ===== */
  function reset(){
    state = "pick";
    hitstopT = 0; shakeT = 0; hitShakeA = 0; hitShakeB = 0;
    stadium.style.transform = "";
    gutsLevel = 0; gutsT = 0;
    gutsBtn.style.display = "none";
    gutsOff();
    if (raf) cancelAnimationFrame(raf);
    resultEl.style.display = "none";
    gauges.style.display = "none";
    stageWrap.style.display = "none";
    var whoCpuR = document.querySelector("#gCpu .who");
    whoCpuR.textContent = "あいて";
    whoCpuR.classList.remove("boss");
    document.getElementById("pick").style.display = "flex";
    shootBtn.style.display = "block";
    shootBtn.disabled = !myBey;
    hintEl.textContent = myBey ? "したの ボタンを おしてね！" : "ベイを えらぶと シュートできるよ";
    if (myBey) preview(); else clearStage();
  }
  document.getElementById("againBtn2").addEventListener("click", function(){ audio(); SFX.pick(); reset(); });

  /* スクロールと引っ張り更新を止めて、画面を固定する */
  document.addEventListener("touchmove", function(e){ e.preventDefault(); }, { passive:false });
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); });

  window.addEventListener("resize", function(){
    fitStadium();
    fitCardTexts();
    if (state==="pick" && myBey) preview();
  });
  window.addEventListener("orientationchange", function(){
    setTimeout(fitCardTexts, 60);
  });
  fitStadium();
})();
</script>
<script>
/* ===== ホーム画面アプリ化（単一HTMLのまま） =====
   アイコンは実行時に Canvas で描いて data URL 化し、
   apple-touch-icon に差す。manifest は Blob URL で動的に付ける。
   図案は上から見たベイ：金属リング＋熱色のブレードとコア（オリジナル） */
(function(){
  "use strict";
  function drawIcon(size){
    var c = document.createElement("canvas"); c.width = c.height = size;
    var x = c.getContext("2d"); x.scale(size/512, size/512);
    /* 地：ダークスチールの放射グラデーション */
    var bg = x.createRadialGradient(256,215,60, 256,256,370);
    bg.addColorStop(0,"#26334d"); bg.addColorStop(.6,"#141e30"); bg.addColorStop(1,"#0a0f18");
    x.fillStyle = bg; x.fillRect(0,0,512,512);
    /* 金属リング */
    var mg = x.createLinearGradient(80,60, 430,460);
    mg.addColorStop(0,"#f4f8ff"); mg.addColorStop(.35,"#8b9bb4"); mg.addColorStop(.55,"#e8eef7"); mg.addColorStop(.8,"#67778f"); mg.addColorStop(1,"#dbe5f2");
    x.beginPath(); x.arc(256,256,196,0,Math.PI*2); x.lineWidth = 56; x.strokeStyle = mg; x.stroke();
    x.beginPath(); x.arc(256,256,224,0,Math.PI*2); x.lineWidth = 4; x.strokeStyle = "rgba(0,0,0,.45)"; x.stroke();
    x.beginPath(); x.arc(256,256,168,0,Math.PI*2); x.lineWidth = 4; x.strokeStyle = "rgba(0,0,0,.45)"; x.stroke();
    /* 溝 */
    x.beginPath(); x.arc(256,256,164,0,Math.PI*2); x.fillStyle = "#101827"; x.fill();
    /* ブレード：熱色の3枚アーク */
    var og = x.createLinearGradient(120,120, 392,392);
    og.addColorStop(0,"#ffb03a"); og.addColorStop(.55,"#f0441c"); og.addColorStop(1,"#c22408");
    x.lineWidth = 62; x.strokeStyle = og;
    for (var i=0;i<3;i++){
      x.beginPath();
      x.arc(256,256,126, i*Math.PI*2/3 + 0.34, (i+1)*Math.PI*2/3 - 0.34);
      x.stroke();
    }
    /* コア */
    var cg = x.createRadialGradient(232,232,10, 256,256,66);
    cg.addColorStop(0,"#ffc46b"); cg.addColorStop(.5,"#f96a1e"); cg.addColorStop(1,"#d92c08");
    x.beginPath(); x.arc(256,256,64,0,Math.PI*2); x.fillStyle = cg; x.fill();
    x.lineWidth = 7; x.strokeStyle = "#e8eef7"; x.stroke();
    /* 中心ボルト */
    var bt = x.createLinearGradient(220,220, 292,292);
    bt.addColorStop(0,"#ffffff"); bt.addColorStop(1,"#9fb0c6");
    x.beginPath(); x.arc(256,256,25,0,Math.PI*2); x.fillStyle = bt; x.fill();
    x.beginPath(); x.arc(256,256,10,0,Math.PI*2); x.fillStyle = "#141d2e"; x.fill();
    /* リング左上のハイライト */
    x.beginPath(); x.arc(256,256,196, Math.PI*1.04, Math.PI*1.44); x.lineWidth = 18; x.strokeStyle = "rgba(255,255,255,.32)"; x.stroke();
    return c;
  }
  try {
    var icon512 = drawIcon(512);
    var url512 = icon512.toDataURL("image/png");
    var url192 = drawIcon(192).toDataURL("image/png");
    var url180 = drawIcon(180).toDataURL("image/png");
    /* maskable 用：安全圏に収まるよう少し小さく描いた版 */
    var mc = document.createElement("canvas"); mc.width = mc.height = 512;
    var mx = mc.getContext("2d");
    mx.fillStyle = "#0a0f18"; mx.fillRect(0,0,512,512);
    mx.drawImage(icon512, 38, 38, 436, 436);
    var urlMask = mc.toDataURL("image/png");
    /* iOS ホーム画面アイコン（data URL が効く範囲で差す） */
    var at = document.createElement("link");
    at.rel = "apple-touch-icon"; at.href = url180;
    document.head.appendChild(at);
    /* manifest（Blob URL）：start_url / scope は省略し、
       既定（この文書のURL）に従わせる */
    var manifest = {
      name: "ベイブレード",
      short_name: "ベイブレード",
      display: "standalone",
      background_color: "#0a0f18",
      theme_color: "#0a0f18",
      icons: [
        { src: url192, sizes: "192x192", type: "image/png" },
        { src: url512, sizes: "512x512", type: "image/png" },
        { src: urlMask, sizes: "512x512", type: "image/png", purpose: "maskable" }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
    var ml = document.createElement("link");
    ml.rel = "manifest"; ml.href = URL.createObjectURL(blob);
    document.head.appendChild(ml);
  } catch(e) {}
})();
</script>
