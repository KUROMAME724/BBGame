           寄せだけでは追いつかず逆に壁へ張り付いた）。
           そのため、寄せる前に「基底がこのフレームで回る角度ぶん
           だけ速度を先回りで回して」回転による成分の漏れを打ち消す
           （平行移動）。回す角度は近似式（vt/d×dt）だと実際の
           基底回転と毎フレーム僅かにずれ、vt が大きいベイでは
           残差が見かけの外向き速度として積み上がって振動した
           （実測で確認）ため、出力速度から決まる正確な弦の角度
           atan2(vt×dt, d＋vr×dt) を使い、出力で再計算して
           もう一度回す固定点反復で残差を消す。これで周回しながら
           でも半径誤差が確実に解消され、目標半径へ実際に追随する。
           寄せの速さは半径方向を速め（dt*4.2）、接線方向は
           穏やか（dt*2.2）にし、復帰ランプは従来通り両方に掛ける。
           成分がゼロを横切るときも速度は連続で、逆向き発射には
           ならない */
        var desMag = Math.hypot(desVx, desVy);
        var rateR = Math.min(1, dt*4.2) * ramp;
        var rateT = Math.min(1, dt*2.2) * ramp;
        var vrIn = p.vx*ux + p.vy*uy;
        var vtIn = p.vx*tx + p.vy*ty;
        /* 平行移動つき成分寄せ（2回の固定点反復）：
           回す角度 → 成分を寄せる → 出力速度から角度を再計算、
           を2回繰り返すと、基底回転と速度の自己整合が取れる。
           角度の符号には周回方向 dir が必須：位置角度の変化は
           atan2(dir×vt×dt, d＋vr×dt) で、dir を落とすと逆回りの
           ベイ（CPU側）だけ回転が逆向きになり、漏れが倍増して
           壁に張り付く（実測で確認済みの不具合） */
        var dAng = Math.atan2(p.dir * vtIn * dt, Math.max(1, d + vrIn * dt));
        var vrWork = vrIn, vtWork = vtIn, vrBase = vrIn, vtBase = vtIn;
        for (var itSteer = 0; itSteer < 2; itSteer++){
          var cosA = Math.cos(dAng), sinA = Math.sin(dAng);
          var rvx = p.vx*cosA - p.vy*sinA;
          var rvy = p.vx*sinA + p.vy*cosA;
          vrBase = rvx*ux + rvy*uy;
          vtBase = rvx*tx + rvy*ty;
          vrWork = vrBase + (radialV - vrBase) * rateR;
          vtWork = vtBase + (os - vtBase) * rateT;
          dAng = Math.atan2(p.dir * vtWork * dt, Math.max(1, d + vrWork * dt));
        }
        /* 加速度リミット（成分版）：1フレームの成分変化量に上限を
           付け、向き・大きさが跳ばないことを保証する。以前は
           世界座標の速度変化量に上限（r*15*dt）を付けていたが、
           それだと平行移動に必要なベクトルの回転そのものまで
           切り捨ててしまい、速いベイ（ウルフ等）で回転不足→
           成分漏れ→外周に張り付く不具合になった（実測で確認）。
           回転は座標変換であって加速ではないので、数えるのは
           成分の変化だけにする（上限値は従来と同じ r*15*dt） */
        var limC = r * 15 * dt;
        if (vrWork - vrBase > limC) vrWork = vrBase + limC; else if (vrBase - vrWork > limC) vrWork = vrBase - limC;
        if (vtWork - vtBase > limC) vtWork = vtBase + limC; else if (vtBase - vtWork > limC) vtWork = vtBase - limC;
        /* 復帰中の操舵は「回転＋大きさ寄せ」に切り替える：
           成分を個別に直線で寄せる方式だと、弾かれて接線成分が
           逆向きになったベイの速度ベクトルが成分空間の原点近くを
           通過し（速さがほぼゼロまで落ち）、向きが短時間に反転して
           「急に無理矢理元の周回方向へ動き出す」見え方になる
           （ゼロ跨ぎ。切り出しシミュレーションで、原点通過の瞬間に
           向きの変化率が上限の数倍へ跳ねることを確認）。
           そこで復帰中だけ、現在成分の向きを目標成分
           （radialV, os）の向きへ上限つきの速度（約5.2 rad/秒）で
           回し、大きさは目標の大きさへ滑らかに寄せる。速さを保った
           ままUターンの弧を描いて周回へ戻るので、ゼロ跨ぎは起きない。
           上限は以前 2.6 rad/秒だったが、それでは弾かれて半径方向や
           逆向きになった速度が周回方向へ向き直る前に次の衝突が来て
           しまい（次の衝突までに復帰できるのは約半数）、ぶつかる
           ほど「戻れない時間」が積み上がって遅く見えた（実測）。
           5.2 rad/秒でも1フレームの向き変化は約5°で、弧を描く
           戻り方のまま、復帰完了は約3/4まで上がることを確認済み。
           回転は平行移動で基底回転を打ち消し済みの成分空間で数える
           ため、通常周回や半径の縮小追随には干渉しない（通常時は
           従来の成分別の引き寄せのまま）。速度がほぼゼロのときは
           向きが定まらないので、従来の引き寄せ結果を使う */
        if (p.recoverT < 1.8){
          var mCur = Math.hypot(vrBase, vtBase);
          if (mCur > r * 0.05){
            var aCur = Math.atan2(vtBase, vrBase);
            var aTgt = Math.atan2(os, radialV);
            var mTgt = Math.hypot(radialV, os);
            var dTurn = aTgt - aCur;
            while (dTurn > Math.PI) dTurn -= Math.PI * 2;
            while (dTurn < -Math.PI) dTurn += Math.PI * 2;
            var maxTurn = 5.2 * dt;
            if (dTurn > maxTurn) dTurn = maxTurn; else if (dTurn < -maxTurn) dTurn = -maxTurn;
            var aNew = aCur + dTurn;
            var mNew = mCur + (mTgt - mCur) * Math.min(1, dt * 3.2 * ramp);
            vrWork = Math.cos(aNew) * mNew;
            vtWork = Math.sin(aNew) * mNew;
          }
        }
        p.vx = ux*vrWork + tx*vtWork;
        p.vy = uy*vrWork + ty*vtWork;
        /* 加速度リミットは操舵ブロック内の「成分版」に移設した
           （世界座標の変化量だと平行移動の回転を切り捨ててしまう
           ため。衝突・壁の跳ね返しは従来通り対象外） */
        /* 速度の「大きさ」の寄せも復帰中はランプに連動させる：
           以前は dt*3.2 でランプと無関係に常時効かせていたため、
           復帰の動きがちぐはぐになっていた。ランプ全開（通常時）は
           従来通り dt*3.2。なお速度天井（speedCap／この後の軟らかい
           クランプと衝突側の clampToBudget）のハード上限は維持し、
           加速ラチェットは再発させない */
        var vNow = Math.hypot(p.vx, p.vy);
        if (vNow > desMag && vNow > 0){
          var magPull = Math.min(1, dt*3.2 * ramp);
          var newMag = vNow + (desMag - vNow) * magPull;
          p.vx *= newMag / vNow; p.vy *= newMag / vNow;
        }
      }
      /* 速度の上限：固定値ではなく、その時点の目標軌道速度と
         残りspinから決まる天井（speedCap）を使う。
         kickT終了時も即時クランプせず、軟らかい処理で
         超過分を漸近的に削る（復帰の瞬間に速度がガクッと切れない） */
      var v = Math.hypot(p.vx,p.vy);
      var vmax = speedCap(p, r, speedRatio);
      if (v > vmax){
        var softCap = vmax + (v - vmax) * Math.max(0, 1 - dt*3);
        p.vx *= softCap/v; p.vy *= softCap/v;
      }
      p.x += p.vx*dt; p.y += p.vy*dt;
      /* 壁：スタジアムの縁でバチンと弾かれる（両者同じ） */
      var dd = Math.hypot(p.x-cx, p.y-cy);
      if (dd > maxD){
        var nx = (p.x-cx)/dd, ny = (p.y-cy)/dd;
        p.x = cx + nx*maxD; p.y = cy + ny*maxD;
        var dot = p.vx*nx + p.vy*ny;
        if (dot > 0){
          p.vx -= 1.9*dot*nx; p.vy -= 1.9*dot*ny;
          p.vx *= 0.94; p.vy *= 0.94;
          if (dot > r*0.4){ sparks(p.x, p.y, 6); SFX.clash(false); p.spin -= 1.2; }
        }
      }
      p.ang += dt * (p.me?1:-1) * p.spin * 0.80;
      /* ヒットストップ中の震えは見た目だけ：判定位置(p.x/p.y)は動かさず、
         transformに小さなランダムオフセットを足すだけ。
         受けた側(hitShake大)が大きく、与えた側は小さく震える */
      var jx = 0, jy = 0;
      if (hitstopT > 0 && hitShakeDur > 0){
        var amp = (p === P[0] ? hitShakeA : hitShakeB) * Math.max(0, hitstopT / hitShakeDur);
        if (amp > 0.2){ jx = (Math.random()*2-1) * amp; jy = (Math.random()*2-1) * amp; }
      }
      p.el.style.transform = "translate("+(p.x-rad+jx)+"px,"+(p.y-rad+jy)+"px) rotate("+p.ang+"deg)";
      /* ねばり中はフラフラ（wobble）も止まる＝粘って回り続けているのが見える */
      p.el.classList.toggle("wobble", speedRatio < 0.3 && p.spin > 0 && !(p.me && gutsT > 0));
    });

    /* 衝突：本物みたいに両方が反対方向へ弾かれる */
    if (P.length===2){
      var a=P[0], b=P[1];
      var dx=b.x-a.x, dy=b.y-a.y, dist=Math.hypot(dx,dy);
      var hitDist = size*0.92;
      if (dist < hitDist && dist > 0.01){
        var nx=dx/dist, ny=dy/dist;
        /* めり込みを両方で半分ずつ押し戻す */
        var overlap = hitDist - dist;
        a.x -= nx*overlap/2; a.y -= ny*overlap/2;
        b.x += nx*overlap/2; b.y += ny*overlap/2;
        /* 法線方向の接近速度（正なら向かい合って近づいている） */
        var van = a.vx*nx + a.vy*ny, vbn = b.vx*nx + b.vy*ny;
        var approach = van - vbn;
        if (approach > 0 && a.clashCd <= 0 && b.clashCd <= 0){
          var hard = approach > r*0.32;
          /* ===== 速度予算：衝突は「無予算の加算」ではなく
             「上限付きの付け替え」にする =====
             衝突前の速度の大きさと、その時点の天井（目標軌道速度と
             残りspinから決まる speedCap）を先に控える。
             kick／swirl には天井に近いほど小さくなる逓減係数を掛け、
             適用後も各ベイの速さが「衝突前＋1回分のkick相当」と
             天井の小さい方を超えないよう付け替える（下でクランプ）。
             これで激しさ（はじき・吹っ飛び）は残したまま、
             ぶつかるたびに速さが積み上がるラチェットを断つ */
          var spinRa = a.spin/a.max, spinRb = b.spin/b.max;
          var avgSpin = (spinRa + spinRb) / 2;
          var preSpeedA = Math.hypot(a.vx, a.vy);
          var preSpeedB = Math.hypot(b.vx, b.vy);
          var capA = speedCap(a, r, spinRa);
          var capB = speedCap(b, r, spinRb);
          var dimA = diminishFactor(preSpeedA, capA);
          var dimB = diminishFactor(preSpeedB, capB);
          /* 弾性衝突：法線成分を入れ替えるように両方を跳ね返す（反発係数つき） */
          var rest = hard ? 0.96 : 0.88;
          var impulse = (1 + rest) * approach / 2;
          a.vx -= impulse*nx; a.vy -= impulse*ny;
          b.vx += impulse*nx; b.vy += impulse*ny;
          /* ノックバック：名目は従来比で約1.35倍のまま（体感維持）。
             非対称も維持する：回転がより残っている側（強く当たった側）が
             相手をより遠くへ弾き、自分はあまり飛ばない。
             ただし approach 比例項はそのまま使うと、速くなるほど
             次の approach が増えて kick が増える自己増幅になるため、
             approach は r*0.85 で頭打ちにした値を使う。
             さらに実効 kick には逓減係数（dim）を掛ける */
          var approachCapped = Math.min(approach, r * 0.85);
          var kick = (r * (0.16 + 0.30*avgSpin) + approachCapped * 0.28) * 1.35;
          var edge = spinRa - spinRb; /* -1〜1：正なら a の方が回転が残っている */
          var kickNomA = kick * (1 - 0.45*edge);
          var kickNomB = kick * (1 + 0.45*edge);
          var kickA = kickNomA * dimA;
          var kickB = kickNomB * dimB;
          a.vx -= nx*kickA; a.vy -= ny*kickA;
          b.vx += nx*kickB; b.vy += ny*kickB;
          /* 横方向のキック：当たったあとカーブして離れる、本物のベイらしい動き。
             符号はランダムではなく各ベイ自身の周回方向（dir）に合わせる：
             自分の回る向きと喧嘩しないので、弾かれたあと逆向きに動いてから
             無理に回り始める二段モーションにならない。名目の大きさは
             従来通りだが、実効値には kick と同じ逓減係数を掛ける */
          var swMag = (Math.random()*0.7 + 0.5) * r * 0.22;
          var adx = a.x-cx, ady = a.y-cy, ad = Math.hypot(adx,ady)||1;
          var bdx = b.x-cx, bdy = b.y-cy, bd = Math.hypot(bdx,bdy)||1;
          a.vx += (-ady/ad)*a.dir*swMag*dimA; a.vy += (adx/ad)*a.dir*swMag*dimA;
          b.vx += (-bdy/bd)*b.dir*swMag*dimB; b.vy += (bdx/bd)*b.dir*swMag*dimB;
          /* 付け替えクランプ：弾性交換＋kick＋swirl を全部入れた後で、
             各ベイの速さを「天井」と「衝突前＋名目kick1回分」の
             小さい方以下に収める。1回の衝突で増える速さは
             最大でも kick 1回分までになり、際限なくは上がらない */
          clampToBudget(a, preSpeedA, kickNomA, capA);
          clampToBudget(b, preSpeedB, kickNomB, capB);
          /* 弾かれた直後は二人とも一瞬ゆっくりに見せてから勢いよく離れる */
          /* クールダウンは 0.21 秒：巡航速度の底上げ（約1.1倍）で
             衝突頻度が増えたぶんを均し、毎秒ダメージを従来並みに保つ */
          a.clashCd = 0.21; b.clashCd = 0.21;
          a.kickT = 0.25; b.kickT = 0.25;
          /* 復帰ランプは当たるたびに 0 へ戻さず、上限 0.9 までに
             留める：衝突間隔（約0.7秒）よりランプ全長（1.8秒）が
             長いため、0 へ戻すと次の衝突までに操舵が戻り切らず、
             ぶつかるほど復帰が重なって遅くなっていく。0.9 なら
             ランプは約5割から再開し、回転モード（recoverT<1.8）の
             向き変化上限もそのまま効くので、急な向き直りにはならない */
          a.recoverT = Math.min(a.recoverT || 0, 0.9);
          b.recoverT = Math.min(b.recoverT || 0, 0.9);
          /* ヒットストップはダメージ確定後に下で設定する（受けた側の判定に使うため） */
          /* ダメージ：与える側の atk × 受ける側の guard で決まる（両者共通の式）。
             攻撃タイプは atk 1.3 で大きく削るが guard は普通（1.0）。
             スタミナは atk 0.7 で削りは小さいが guard は標準（1.0）で、
             勝ち筋は遅い decay による粘り勝ち（2026-11-22 底上げ）。
             防御は atk 0.9 で削りはほどほど、guard 0.6 で硬い。
             CPUの基礎倍率は与ダメージにも同じだけ乗る */
          var multA = b.me ? 1 : b.b.cpuMult; /* b→a への倍率 */
          var multB = a.me ? 1 : a.b.cpuMult; /* a→b への倍率 */
          var dmgA = (3.5 + Math.random()*4.5) * b.b.atk * (hard?1.5:1.1) * a.b.guard * multA;
          var dmgB = (3.5 + Math.random()*4.5) * a.b.atk * (hard?1.5:1.1) * b.b.guard * multB;
          /* 序盤ランプ：開始〜約9秒は衝突ダメージ全体を 0.70→1.00 に
             滑らかに上げる（両者同じ倍率なので相性は崩れない） */
          var earlyMul = earlyDmgFactor();
          dmgA *= earlyMul; dmgB *= earlyMul;
          /* 追いつき補正：この一撃を受ける直前のゲージ割合で判定し、
             負けている側の被ダメージだけを最大18%軽減する */
          var ratioForCutA = a.spin / a.max, ratioForCutB = b.spin / b.max;
          var cutA = catchUpCut(ratioForCutA, ratioForCutB);
          var cutB = catchUpCut(ratioForCutB, ratioForCutA);
          if (cutA > 0) dmgA *= (1 - cutA);
          if (cutB > 0) dmgB *= (1 - cutB);
          /* ねばり中はプレイヤーの受けるダメージも軽減される（最大20%）。
             ゲージ減少の主因は衝突なので、ここに効かせないと体感できない。
             軽減率は以前60%だったが、ペンギン対ゴーレムで「ねばる」を
             使うと約9割勝ててしまい圧勝すぎたため20%まで下げた
             （シミュレーション検証：同対戦のねばる勝率 約74%、
             ねばる無しは約3割・接戦のまま不変）。
             連打が速い間だけ、軽減は gutsPower() 経由で最大26%まで
             ほんの少しだけ深くなる（+3割が上限） */
          if (gutsT > 0){
            var dmgCut = Math.min(0.26, 0.2 * gutsPower());
            if (a.me) dmgA *= (1 - dmgCut);
            if (b.me) dmgB *= (1 - dmgCut);
            /* ねばり中は自分の攻撃力も少し上がる：基本×1.10、
               連打最速でも×1.25まで（gutsAtkMul でクランプ済み）。
               効くのは発動中の衝突だけなので影響は限定的 */
            var atkMulNow = gutsAtkMul();
            if (a.me) dmgB *= atkMulNow;
            if (b.me) dmgA *= atkMulNow;
          }
          var preSpinA = a.spin, preSpinB = b.spin;
          a.spin -= dmgA; b.spin -= dmgB;
          /* 場外決着の印：この一撃でゲージが尽きた側は、決着時に
             スタジアムの外へ吹っ飛ぶ。自然減衰で尽きた場合には
             付けない（従来通りその場で止まる）。
             飛ぶ向きもここで決める：この時点の速度は衝突後の
             ノックバック（反発で相手から押し出された向き）なので、
             その向きを記録しておき、finish 側は中心から外向きでは
             なく、その反発方向へ飛ばす */
          if (preSpinA > 0.5 && a.spin <= 0.5){ a.ringOut = true; setRingOutDir(a, -nx, -ny); }
          if (preSpinB > 0.5 && b.spin <= 0.5){ b.ringOut = true; setRingOutDir(b,  nx,  ny); }
          /* ===== 手応え：ヒットストップ＋震え＋ヒットマーク＋画面振動 =====
             止まる長さは衝撃の強さで変える（通常 約50ms／強い一撃 約110ms）。
             受けた側（受けたダメージが大きい側）を大きく震わせる */
          hitstopT = hard ? 0.11 : 0.05;
          hitShakeDur = hitstopT;
          if (dmgA >= dmgB){ hitShakeA = hard?5.5:3.5; hitShakeB = hard?2:1.2; }
          else             { hitShakeB = hard?5.5:3.5; hitShakeA = hard?2:1.2; }
          /* 画面振動は強い一撃だけ：約0.18秒、最大約5px、最初強く→収束 */
          if (hard){ shakeDur = 0.18; shakeT = shakeDur; shakeAmp = Math.min(6, r*0.018); }
          var hitX = (a.x+b.x)/2, hitY = (a.y+b.y)/2;
          sparks(hitX, hitY, hard?16:9, hard);
          ringFx(hitX, hitY, hard);
          hitCore(hitX, hitY, hard);
          SFX.clash(hard);
          if (navigator.vibrate) navigator.vibrate(hard?60:25);
          /* バースト：強い一撃のときだけ、残りゲージが少ない相手が
             ごくまれに弾け飛ぶ（目安は3試合に1回起きるかどうか）。
             攻撃タイプの強い一撃を受けたときは少しだけ起きやすい
             （両者同じルール）。通常ヒットではバーストしない */
          if (hard){
            var burstThreshA = (b.b.tip === "flat") ? 0.30 : 0.22;
            var burstProbA   = (b.b.tip === "flat") ? 0.04 : 0.03;
            var burstThreshB = (a.b.tip === "flat") ? 0.30 : 0.22;
            var burstProbB   = (a.b.tip === "flat") ? 0.04 : 0.03;
            if (a.spin < a.max*burstThreshA && Math.random()<burstProbA) return finish(a, true);
            if (b.spin < b.max*burstThreshB && Math.random()<burstProbB) return finish(b, true);
          }
        } else if (approach > 0){
          /* クールダウン中はすり抜けず、軽く押し合いだけ続ける。
             ここも無予算で足し続けると積み上がるので、適用後は
             各ベイの速さを天井以下に収める */
          var soft = approach * 0.5;
          a.vx -= nx*soft; a.vy -= ny*soft;
          b.vx += nx*soft; b.vy += ny*soft;
          var capSa = speedCap(a, r, a.spin/a.max);
          var capSb = speedCap(b, r, b.spin/b.max);
          var vSa = Math.hypot(a.vx, a.vy), vSb = Math.hypot(b.vx, b.vy);
          if (vSa > capSa && vSa > 0){ a.vx *= capSa/vSa; a.vy *= capSa/vSa; }
          if (vSb > capSb && vSb > 0){ b.vx *= capSb/vSb; b.vy *= capSb/vSb; }
        }
      }
    }
    updateGauges();

    var loser = null;
    P.forEach(function(p){ if (p.spin <= 0.5) loser = p; });
    if (loser) return finish(loser, false);

    raf = requestAnimationFrame(tick);
  }

  function sparks(x,y,n,hard){
    /* 同時に出る火花の総数に上限を付ける（iPadでの描画負荷対策）。
       上限に達していたら新しい火花は出さない */
    var liveSparks = stadium.querySelectorAll(".spark").length;
    if (liveSparks >= 42) return;
    if (liveSparks + n > 42) n = 42 - liveSparks;
    for (var i=0;i<n;i++){
      var s = document.createElement("div");
      s.className = "spark" + (hard && i%3===0 ? " big" : "");
      s.style.left = x+"px"; s.style.top = y+"px";
      stadium.appendChild(s);
      var a = Math.random()*Math.PI*2, d = 26+Math.random()*(hard?78:54);
      s.animate([
        { transform:"translate(0,0) scale(1)", opacity:1 },
        { transform:"translate("+(Math.cos(a)*d)+"px,"+(Math.sin(a)*d)+"px) scale(.2)", opacity:0 }
      ], { duration:260+Math.random()*220, easing:"ease-out" });
      setTimeout((function(el){ return function(){ el.remove(); }; })(s), 520);
    }
  }
  function ringFx(x,y,hard){
    var s = document.createElement("div");
    s.className = "ringFx" + (hard ? " hard" : ""); s.style.left = x+"px"; s.style.top = y+"px";
    stadium.appendChild(s);
    setTimeout(function(){ s.remove(); }, hard ? 460 : 340);
  }
  /* 当たった位置の白い芯（ヒットマークの中心） */
  function hitCore(x,y,hard){
    var s = document.createElement("div");
    s.className = "hitCore" + (hard ? " hard" : ""); s.style.left = x+"px"; s.style.top = y+"px";
    stadium.appendChild(s);
    setTimeout(function(){ s.remove(); }, hard ? 260 : 200);
  }
  /* バースト時のフラッシュ：一瞬だけ画面を白く光らせる */
  function burstFlash(){
    if (!flashEl) return;
    flashEl.animate([
      { opacity:0.9 }, { opacity:0 }
    ], { duration:260, easing:"ease-out" });
  }

  /* ===== ゲージ ===== */
  var fillYou = document.querySelector("#gYou .fill");
  var fillCpu = document.querySelector("#gCpu .fill");
  var lastGaugeYou = -1, lastGaugeCpu = -1;
  function updateGauges(){
    if (!P.length) return;
    /* 幅がほとんど変わっていないフレームでは書き換えない
       （毎フレームのスタイル再計算と再描画を減らす） */
    var wy = Math.max(0, P[0].spin/P[0].max*100);
    var wc = Math.max(0, P[1].spin/P[1].max*100);
    if (Math.abs(wy - lastGaugeYou) >= 0.3 || (wy <= 0 && lastGaugeYou > 0)){ fillYou.style.width = wy + "%"; lastGaugeYou = wy; }
    if (Math.abs(wc - lastGaugeCpu) >= 0.3 || (wc <= 0 && lastGaugeCpu > 0)){ fillCpu.style.width = wc + "%"; lastGaugeCpu = wc; }
  }

  /* ===== 終了 ===== */
  function finish(loser, burst){
    state = "end";
    gutsBtn.style.display = "none";
    gutsLevel = 0; gutsT = 0;
    gutsOff();
    if (raf) cancelAnimationFrame(raf);
    var winner = (loser === P[0]) ? P[1] : P[0];
    var iWin = winner.me;

    if (burst){
      SFX.burst();
      if (navigator.vibrate) navigator.vibrate([80,40,120]);
      /* バーストは最長のヒットストップ（約200ms）＋フラッシュ：
         一瞬止まって激しく震えてから、パーツが弾け飛ぶ */
      burstFlash();
      /* 終了後はtickが止まるので、画面振動はWAAPIで直接かける（短く収束） */
      if (stadium.animate){
        stadium.animate([
          { transform:"translate(0px,0px)" },
          { transform:"translate(5px,-4px)" },
          { transform:"translate(-4px,3px)" },
          { transform:"translate(2px,-1px)" },
          { transform:"translate(0px,0px)" }
        ], { duration:220, easing:"ease-out" });
      }
      var br = stadium.clientWidth, brad = br*0.162/2;
      var baseTr = "translate("+(loser.x-brad)+"px,"+(loser.y-brad)+"px) rotate("+loser.ang+"deg)";
      var bStart = performance.now();
      (function bShake(now){
        var bt = (now-bStart)/1000;
        if (bt >= 0.2 || state !== "end"){ loser.el.style.transform = baseTr; return; }
        var ba = 6 * (1 - bt/0.2);
        loser.el.style.transform = "translate("+(loser.x-brad+(Math.random()*2-1)*ba)+"px,"+(loser.y-brad+(Math.random()*2-1)*ba)+"px) rotate("+loser.ang+"deg)";
        requestAnimationFrame(bShake);
      })(bStart);
      setTimeout(function(){
        if (state !== "end") return;
        loser.el.innerHTML = beyPiecesHTML(loser.b);
        var dirs = [[-1,-1],[ -1.4,0.4],[1,1]];
        var pieces = loser.el.querySelectorAll(".piece");
        pieces.forEach(function(pc, i){
          pc.style.transform = "translate("+(dirs[i][0]*70)+"px,"+(dirs[i][1]*70)+"px) rotate("+(i*70-60)+"deg)";
          pc.style.opacity = "0.25";
        });
        sparks(loser.x, loser.y, 22, true);
      }, 200);
    } else if (loser.ringOut){
      /* 場外決着：衝突ダメージでゲージが尽きたベイは、決着した衝突の
         ノックバック方向（相手から押し出された向き）へ大きく吹っ飛んで
         スタジアムの外へ消える。
         演出は2段構え：まず約0.18秒のヒットストップ級の「タメ」
         （その場で小刻みに震える。バーストの約200msと同級で、
         長すぎない長さ）を作り、それから初速の強いイージングで
         一気に吹っ飛ばす。タメ＋飛行で約0.88秒、結果ポップアップ
         （約1.1秒後）より前に飛び切る。
         スタジアムは overflow:hidden で外側が切り取られるので、
         決着中だけ visible に切り替える（リセットで戻す） */
      SFX.clash(true);
      if (navigator.vibrate) navigator.vibrate(50);
      stadium.style.overflow = "visible";
      var fr = stadium.clientWidth, frad = fr*0.162/2;
      var fux, fuy;
      if (loser.ringOutDx !== null && loser.ringOutDx !== undefined){
        /* 決着した衝突で記録したノックバック方向（相手から離れる
           反発の向き）へ飛ばす。中心から外向きではない */
        fux = loser.ringOutDx; fuy = loser.ringOutDy;
      } else {
        /* 記録が無い場合の予備：従来通り中心から外向き */
        var fdx = loser.x - fr/2, fdy = loser.y - fr/2;
        var fdl = Math.hypot(fdx, fdy);
        if (fdl > 1){ fux = fdx/fdl; fuy = fdy/fdl; }
        else { fux = (loser.x <= fr/2) ? 1 : -1; fuy = -0.35; }
      }
      var flyD = fr * 1.0;
      var fStart = "translate("+(loser.x-frad)+"px,"+(loser.y-frad)+"px) rotate("+loser.ang+"deg)";
      var fEnd = "translate("+(loser.x-frad+fux*flyD)+"px,"+(loser.y-frad+fuy*flyD)+"px) rotate("+(loser.ang+540)+"deg)";
      /* タメ：約0.18秒、その場で震えてから発射する（バーストの
         震えと同じ仕組み）。発射の瞬間に火花と音で爆発感を足す */
      var rStart = performance.now();
      (function rShake(now){
        if (state !== "end") return;
        var rt = (now - rStart) / 1000;
        if (rt < 0.18){
          var ra = 5 * (1 - rt / 0.18);
          loser.el.style.transform = "translate("+(loser.x-frad+(Math.random()*2-1)*ra)+"px,"+(loser.y-frad+(Math.random()*2-1)*ra)+"px) rotate("+loser.ang+"deg)";
          requestAnimationFrame(rShake);
          return;
        }
        loser.el.style.transform = fStart;
        SFX.shoot(); SFX.spinout();
        if (navigator.vibrate) navigator.vibrate(60);
        sparks(loser.x, loser.y, 16, true);
        ringFx(loser.x, loser.y, true);
        if (loser.el.animate){
          /* 初速全開のイージング（最初にぐっと加速して後は流れる）で
             「どかーん」と弾け飛ぶ。消えるのは最後の2割だけ */
          loser.el.animate([
            { transform:fStart, opacity:1 },
            { transform:fEnd, opacity:1, offset:.8 },
            { transform:fEnd, opacity:0 }
          ], { duration:700, easing:"cubic-bezier(.12,.8,.24,1)", fill:"forwards" });
        } else {
          loser.el.style.transform = fEnd;
          loser.el.style.opacity = "0";
        }
      })(rStart);
    } else {
      SFX.spinout();
      loser.el.classList.add("wobble");
    }
    /* 勝者は回り続ける */
    var start = performance.now();
    (function celeb(now){
      if (state !== "end") return;
      var t = (now-start)/1000;
      winner.ang += 0.36;
      var r = stadium.clientWidth, rad = r*0.162/2;
      winner.el.style.transform = "translate("+(winner.x-rad)+"px,"+(winner.y-rad)+"px) rotate("+winner.ang+"deg) scale("+(1+Math.sin(t*6)*0.05)+")";
      if (t < 1.6) requestAnimationFrame(celeb);
    })(start);

    setTimeout(function(){
      var rb = document.getElementById("resBig");
      rb.textContent = iWin ? "かった！！" : "まけた…";
      rb.classList.toggle("win", iWin);
      document.getElementById("resSub").classList.toggle("burst", !!burst);
      document.getElementById("resSub").textContent =
        burst ? (iWin ? "あいてが バラバラに なった！" : "バラバラに なっちゃった…")
              : (iWin ? "あいてが とまった！" : "とまっちゃった…");
      resultEl.style.display = "flex";
      if (iWin){ SFX.win(); confetti(); } else { SFX.lose(); }
    }, burst ? 900 : 1100);
  }

  function confetti(){
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var colors = ["#ef4444","#3b82f6","#22c55e","#eab308","#9ca3af","#7dd3fc","#a855f7","#b45309","#facc15"];
    for (var i=0;i<70;i++){
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = (Math.random()*100)+"vw";
      c.style.background = colors[i%colors.length];
      var sz = 8+Math.random()*10;
      c.style.width = sz+"px"; c.style.height = sz*0.6+"px";
      c.style.animationDuration = (1.6+Math.random()*1.6)+"s";
      c.style.animationDelay = (Math.random()*0.5)+"s";
      document.body.appendChild(c);
      setTimeout((function(el){ return function(){ el.remove(); }; })(c), 4200);
    }
  }

  /* ===== リセット ===== */
  function reset(){
    state = "pick";
    document.body.classList.remove("battling");
    hitstopT = 0; shakeT = 0; hitShakeA = 0; hitShakeB = 0;
    stadium.style.transform = "";
    stadium.style.overflow = ""; /* 場外決着で visible にしたのを戻す */
    gutsLevel = 0; gutsT = 0;
    gutsBtn.style.display = "none";
    gutsOff();
    if (raf) cancelAnimationFrame(raf);
    resultEl.style.display = "none";
    gauges.style.display = "none";
    stageWrap.style.display = "none";
    var whoCpuR = document.querySelector("#gCpu .who");
    whoCpuR.textContent = "あいて";
    whoCpuR.classList.remove("boss");
    document.getElementById("pick").style.display = "flex";
    shootBtn.style.display = "block";
    shootBtn.disabled = !myBey;
    hintEl.textContent = myBey ? "したの ボタンを おしてね！" : "ベイを えらぶと シュートできるよ";
    if (myBey) preview(); else clearStage();
  }
  document.getElementById("againBtn2").addEventListener("click", function(){ audio(); SFX.pick(); reset(); });

  /* スクロールと引っ張り更新を止めて、画面を固定する */
  document.addEventListener("touchmove", function(e){ e.preventDefault(); }, { passive:false });
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); });

  window.addEventListener("resize", function(){
    fitStadium();
    fitCardTexts();
    if (state==="pick" && myBey) preview();
  });
  window.addEventListener("orientationchange", function(){
    /* 回転で画面の高さが変わり、スタジアムの径の上限も変わるので測り直す */
    setTimeout(function(){ fitStadium(); fitCardTexts(); }, 60);
  });
  fitStadium();
})();
</script>
<script>
/* ===== ホーム画面アプリ化（単一HTMLのまま） =====
   アイコンは実行時に Canvas で描いて data URL 化し、
   apple-touch-icon に差す。manifest は Blob URL で動的に付ける。
   図案は上から見たベイ：金属リング＋熱色のブレードとコア（オリジナル） */
(function(){
  "use strict";
  function drawIcon(size){
    var c = document.createElement("canvas"); c.width = c.height = size;
    var x = c.getContext("2d"); x.scale(size/512, size/512);
    /* 地：ダークスチールの放射グラデーション */
    var bg = x.createRadialGradient(256,215,60, 256,256,370);
    bg.addColorStop(0,"#26334d"); bg.addColorStop(.6,"#141e30"); bg.addColorStop(1,"#0a0f18");
    x.fillStyle = bg; x.fillRect(0,0,512,512);
    /* 金属リング */
    var mg = x.createLinearGradient(80,60, 430,460);
    mg.addColorStop(0,"#f4f8ff"); mg.addColorStop(.35,"#8b9bb4"); mg.addColorStop(.55,"#e8eef7"); mg.addColorStop(.8,"#67778f"); mg.addColorStop(1,"#dbe5f2");
    x.beginPath(); x.arc(256,256,196,0,Math.PI*2); x.lineWidth = 56; x.strokeStyle = mg; x.stroke();
    x.beginPath(); x.arc(256,256,224,0,Math.PI*2); x.lineWidth = 4; x.strokeStyle = "rgba(0,0,0,.45)"; x.stroke();
    x.beginPath(); x.arc(256,256,168,0,Math.PI*2); x.lineWidth = 4; x.strokeStyle = "rgba(0,0,0,.45)"; x.stroke();
    /* 溝 */
    x.beginPath(); x.arc(256,256,164,0,Math.PI*2); x.fillStyle = "#101827"; x.fill();
    /* ブレード：熱色の3枚アーク */
    var og = x.createLinearGradient(120,120, 392,392);
    og.addColorStop(0,"#ffb03a"); og.addColorStop(.55,"#f0441c"); og.addColorStop(1,"#c22408");
    x.lineWidth = 62; x.strokeStyle = og;
    for (var i=0;i<3;i++){
      x.beginPath();
      x.arc(256,256,126, i*Math.PI*2/3 + 0.34, (i+1)*Math.PI*2/3 - 0.34);
      x.stroke();
    }
    /* コア */
    var cg = x.createRadialGradient(232,232,10, 256,256,66);
    cg.addColorStop(0,"#ffc46b"); cg.addColorStop(.5,"#f96a1e"); cg.addColorStop(1,"#d92c08");
    x.beginPath(); x.arc(256,256,64,0,Math.PI*2); x.fillStyle = cg; x.fill();
    x.lineWidth = 7; x.strokeStyle = "#e8eef7"; x.stroke();
    /* 中心ボルト */
    var bt = x.createLinearGradient(220,220, 292,292);
    bt.addColorStop(0,"#ffffff"); bt.addColorStop(1,"#9fb0c6");
    x.beginPath(); x.arc(256,256,25,0,Math.PI*2); x.fillStyle = bt; x.fill();
    x.beginPath(); x.arc(256,256,10,0,Math.PI*2); x.fillStyle = "#141d2e"; x.fill();
    /* リング左上のハイライト */
    x.beginPath(); x.arc(256,256,196, Math.PI*1.04, Math.PI*1.44); x.lineWidth = 18; x.strokeStyle = "rgba(255,255,255,.32)"; x.stroke();
    return c;
  }
  try {
    var icon512 = drawIcon(512);
    var url512 = icon512.toDataURL("image/png");
    var url192 = drawIcon(192).toDataURL("image/png");
    var url180 = drawIcon(180).toDataURL("image/png");
    /* maskable 用：安全圏に収まるよう少し小さく描いた版 */
    var mc = document.createElement("canvas"); mc.width = mc.height = 512;
    var mx = mc.getContext("2d");
    mx.fillStyle = "#0a0f18"; mx.fillRect(0,0,512,512);
    mx.drawImage(icon512, 38, 38, 436, 436);
    var urlMask = mc.toDataURL("image/png");
    /* iOS ホーム画面アイコン（data URL が効く範囲で差す） */
    var at = document.createElement("link");
    at.rel = "apple-touch-icon"; at.href = url180;
    document.head.appendChild(at);
    /* manifest（Blob URL）：start_url / scope は省略し、
       既定（この文書のURL）に従わせる */
    var manifest = {
      name: "ベイブレード",
      short_name: "ベイブレード",
      display: "standalone",
      background_color: "#0a0f18",
      theme_color: "#0a0f18",
      icons: [
        { src: url192, sizes: "192x192", type: "image/png" },
        { src: url512, sizes: "512x512", type: "image/png" },
        { src: urlMask, sizes: "512x512", type: "image/png", purpose: "maskable" }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
    var ml = document.createElement("link");
    ml.rel = "manifest"; ml.href = URL.createObjectURL(blob);
    document.head.appendChild(ml);
  } catch(e) {}
})();
</script>
</body>
